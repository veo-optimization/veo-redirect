<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>BEROO — Візуальна карта проєкту</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--line:#e7e9ee;--text:#202735;--muted:#8d96a8;
  --red:#ff3158;--red2:#ffebef;--blue:#4b7bec;--green:#25a56a;--amber:#d89a20;
  --shadow:0 8px 30px rgba(24,31,48,.07);--radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:flex;overflow:hidden}
.sidebar{width:235px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:4px 10px 20px}
.logo{width:28px;height:28px;border-radius:7px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900}
.nav-title{font-size:11px;text-transform:uppercase;color:#a0a8b8;font-weight:800;margin:20px 10px 8px}
.nav button{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;color:#667084}
.nav button.active,.nav button:hover{background:#fff1f4;color:var(--red)}
.main{min-width:0;flex:1;display:flex;flex-direction:column}
.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}
.topbar .title{font-size:17px;font-weight:800}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:#4d5668;border-radius:10px;padding:8px 11px;font-weight:700;font-size:12px}
.btn:hover{border-color:#cfd4de}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{background:#f7f8fa}
.workspace{min-height:0;flex:1;display:flex;flex-direction:column}
.toolbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;overflow:auto}
.search{min-width:220px;max-width:340px;flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
.search:focus{border-color:#ff9caf}
.canvas-wrap{position:relative;min-height:0;flex:1;overflow:hidden}
.canvas{position:absolute;inset:0;overflow:auto;background:
 radial-gradient(circle at 1px 1px, #e3e6eb 1px, transparent 1px);
 background-size:24px 24px;padding:36px;cursor:grab}
.canvas.dragging{cursor:grabbing}
.graph{position:absolute;left:0;top:0;width:1700px;height:1100px}
.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
.edge{stroke:#cbd1dc;stroke-width:2;fill:none}
.edge.active{stroke:var(--red)}
.node{position:absolute;box-sizing:border-box;width:245px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:14px;user-select:none}
.node.selected{border:2px solid var(--red);padding:13px}
.node .head{display:flex;align-items:center;gap:9px}
.icon{width:34px;height:34px;border-radius:10px;background:#fff0f3;color:var(--red);display:grid;place-items:center;font-weight:900;flex:none}
.node h3{margin:0;font-size:14px;line-height:1.2}
.node p{margin:8px 0 0;color:#8b94a4;font-size:11px;line-height:1.45}
.node .meta{margin-top:10px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10px;border-radius:999px;padding:4px 7px;background:#f1f3f6;color:#697386}
.tag.pro{background:#fff0d9;color:#a66b00}.tag.review{background:#eef3ff;color:#4a6dc7}.tag.core{background:#edf8f2;color:#238359}
.node .dots{position:absolute;right:8px;top:8px;color:#adb4c0}
.node[data-type="entity"]{border-top:3px solid var(--red)}
.node[data-type="module"]{border-top:3px solid var(--blue)}
.node[data-type="analytics"]{border-top:3px solid var(--green)}
.node[data-type="risk"]{border-top:3px solid var(--amber)}
.bottom{height:310px;background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 14px;overflow:auto}
.tab{border:0;background:none;padding:11px 14px;color:#8992a2;font-size:12px;font-weight:800;white-space:nowrap}
.tab.active{color:var(--red);border-bottom:2px solid var(--red)}
.bottom-body{min-height:0;flex:1;overflow:auto;padding:12px 14px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#445064}
textarea.full{width:100%;height:100%;resize:none;border:1px solid var(--line);border-radius:10px;padding:12px;outline:none}
.sidepanel{position:absolute;z-index:20;right:14px;top:14px;width:330px;max-width:calc(100% - 28px);max-height:calc(100% - 28px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 55px rgba(20,27,40,.18);display:none;flex-direction:column}
.sidepanel.open{display:flex}
.panel-head{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.panel-head strong{font-size:14px}.panel-body{padding:14px;overflow:auto}
.field{margin-bottom:12px}.field label{display:block;font-size:10px;color:#7c8698;font-weight:800;text-transform:uppercase;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;outline:none;background:#fff}
.field textarea{min-height:70px;resize:vertical}
.list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid var(--line);border-radius:10px;padding:9px;font-size:11px}.item small{display:block;color:#9aa2b1;margin-top:3px}
.empty{color:#9aa2b1;font-size:11px;padding:12px 0}
.toast{position:fixed;right:18px;bottom:18px;background:#202735;color:#fff;padding:10px 13px;border-radius:10px;font-size:12px;display:none;z-index:100}
.modal{position:fixed;inset:0;background:rgba(20,27,40,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:90}
.modal.open{display:flex}.modal-card{width:560px;max-width:100%;background:#fff;border-radius:18px;box-shadow:0 30px 90px rgba(20,27,40,.25);padding:18px}
.modal-card h2{font-size:16px;margin:0 0 14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.kpi{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.kpi span{padding:6px 8px;background:#f5f6f8;border-radius:8px;font-size:10px;color:#667084}
@media(max-width:900px){
 .sidebar{display:none}.topbar{height:56px;padding:0 10px}.topbar .title{font-size:15px}
 .toolbar{padding:8px}.canvas{padding:20px}.bottom{height:270px}
 .node{width:220px}
 .graph{min-width:1250px}
}
@media(max-width:600px){
 .actions .hide-mobile{display:none}.search{min-width:145px}
 .bottom{height:300px}.bottom-body{padding:10px}.toolbar{flex-wrap:nowrap}
 .sidepanel{top:8px;right:8px;width:calc(100% - 16px);max-height:55vh}
}

/* --- BEROO map editor v2 --- */
.map-controls{position:absolute;left:14px;top:14px;z-index:12;display:flex;flex-direction:column;gap:5px}
.map-controls .btn{width:38px;height:38px;padding:0;font-size:17px;box-shadow:0 5px 16px rgba(24,31,48,.10)}
.zoom-label{font-size:10px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 2px;color:#7d8697}
.canvas{touch-action:none}
.canvas-inner{position:absolute;left:0;top:0;width:1700px;height:1100px;transform-origin:0 0;will-change:transform}
.node{user-select:none}
.node .magnet{position:absolute;top:50%;width:10px;height:38px;transform:translateY(-50%);border-radius:5px;background:#f7d76b;box-shadow:0 0 0 2px rgba(255,255,255,.95),0 0 0 3px rgba(222,190,62,.55);z-index:4}
.node .magnet.left{left:-7px}.node .magnet.right{right:-7px}
.node .magnet.connected{background:#3c7fe8;box-shadow:0 0 0 2px rgba(255,255,255,.95),0 0 0 3px rgba(60,127,232,.55)}
.node .magnet-label{position:absolute;top:calc(50% + 23px);font-size:8px;color:#9ca4b2;white-space:nowrap;opacity:.7}
.node .magnet-label.left{left:-15px}.node .magnet-label.right{right:-15px}
.edge{stroke:#cbd1dc;stroke-width:2.5;fill:none}
.edge.pending{stroke:#e0bb43;stroke-dasharray:5 5}
.edge.active{stroke:#3c7fe8;stroke-width:3}
.edge.hit{stroke:#ff3158;stroke-width:3}
.edge-dot{fill:#e0bb43;stroke:#fff;stroke-width:2}
.edge-dot.connected{fill:#3c7fe8}
.node.conflict{box-shadow:0 0 0 2px rgba(255,174,0,.24),var(--shadow)}
.node .conflict-badge{position:absolute;right:12px;bottom:11px;font-size:9px;border-radius:999px;padding:4px 7px;background:#fff4d9;color:#9a6b00;font-weight:800}
.node .source-badge{position:absolute;left:12px;bottom:11px;font-size:9px;border-radius:999px;padding:4px 7px;background:#eef3ff;color:#4a6dc7;font-weight:800}
.quickbar{display:flex;gap:7px;align-items:center;overflow:auto}
.quickbar .btn{white-space:nowrap}
.bottom.collapsed{height:42px}
.bottom.collapsed .tabs,.bottom.collapsed .bottom-body{display:none}
.bottom-toggle{margin-left:auto}
.drawer{position:absolute;z-index:30;left:14px;top:14px;width:360px;max-width:calc(100% - 28px);max-height:calc(100% - 28px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 70px rgba(20,27,40,.2);display:none;padding:14px}
.drawer.open{display:block}
.drawer h3{margin:0 0 10px;font-size:14px}
.template-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.template{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;text-align:left}
.template:hover{border-color:#ff9caf;background:#fff8f9}
.template strong{font-size:11px;display:block}.template span{font-size:9px;color:#929bab}
.list-node{padding-bottom:11px}
.list-node .list-items{margin-top:10px;border-top:1px solid var(--line);padding-top:7px}
.list-node .list-item{font-size:10px;padding:5px 0;border-bottom:1px dashed #edf0f3;color:#677185}
@media(max-width:600px){
 .map-controls{left:8px;top:8px}
 .map-controls .btn{width:34px;height:34px}
 .drawer{left:8px;top:8px;width:calc(100% - 16px)}
 .template-grid{grid-template-columns:1fr}
}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">B</div> BEROO</div>
    <div class="nav-title">Проєкт</div>
    <div class="nav">
      <button class="active">Візуальна карта</button>
      <button>Сутності</button>
      <button>Модулі CRM</button>
      <button>Біржа</button>
      <button>Аналітика</button>
      <button>Рекомендації</button>
    </div>
    <div class="nav-title">Документація</div>
    <div class="nav">
      <button>Prompt / JSON</button>
      <button>Коментарі</button>
      <button>Зміни</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="title">Візуальна карта BEROO · Marketplace / CRM / Analytics</div>
      <div class="actions">
        <button class="btn ghost hide-mobile" id="addNoteBtn">+ Примітка</button>
        <button class="btn ghost hide-mobile" id="addNodeBtn">+ Підрозділ</button>
        <button class="btn primary" id="exportBtn">Експорт JSON</button>
      </div>
    </header>

    <section class="workspace">
      <div class="toolbar">
        <input id="search" class="search" placeholder="Пошук по карті…">
        <div class="quickbar">
          <button class="btn primary" id="quickAddBtn">＋ Швидко додати</button>
          <button class="btn" id="addListBtn">▤ Блок-список</button>
          <button class="btn" id="fitBtn">Вміст</button>
          <button class="btn" id="resetBtn">Скинути</button>
          <button class="btn" id="commentBtn">💬 Коментар</button>
          <button class="btn" id="promptBtn">Prompt</button>
        </div>
      </div>

      <div class="canvas-wrap">
        <div class="map-controls">
          <button class="btn" id="zoomIn" title="Збільшити">＋</button>
          <div class="zoom-label" id="zoomLabel">100%</div>
          <button class="btn" id="zoomOut" title="Зменшити">−</button>
          <button class="btn" id="zoomFit" title="Підігнати">⌂</button>
        </div>
        <div id="canvas" class="canvas">
          <div id="canvasInner" class="canvas-inner">
            <div id="graph" class="graph">
              <svg id="edges" class="edges"></svg>
            </div>
          </div>
        </div>
        <div id="quickDrawer" class="drawer">
          <h3>Швидке додавання</h3>
          <div class="template-grid">
            <button class="template" data-template="module"><strong>Модуль</strong><span>Звичайний функціональний блок</span></button>
            <button class="template" data-template="entity"><strong>Сутність</strong><span>Користувач, магазин, блогер тощо</span></button>
            <button class="template" data-template="list"><strong>Блок-список</strong><span>Комод із тумбочками / підрозділами</span></button>
            <button class="template" data-template="analytics"><strong>Аналітика</strong><span>Метрики, рейтинг, BI</span></button>
            <button class="template" data-template="risk"><strong>Ризик / конфлікт</strong><span>Суперечність або OPEN DECISION</span></button>
            <button class="template" data-template="decision"><strong>OPEN DECISION</strong><span>Питання, яке потребує бізнес-рішення</span></button>
          </div>
          <div style="margin-top:12px;color:#8b94a4;font-size:10px;line-height:1.45">
            Перетягуй блоки по полотну. Натискай на жовтий магніт, щоб створити непід'єднаний провідок, або на синій/інший магніт — щоб сформувати зв'язок.
          </div>
        </div>

        <aside id="panel" class="sidepanel">
          <div class="panel-head"><strong id="panelTitle">Деталі</strong><button class="btn" id="closePanel">×</button></div>
          <div class="panel-body" id="panelBody"></div>
        </aside>
      </div>

      <section class="bottom">
        <div class="tabs">
          <button class="tab active" data-tab="json">Динамічний JSON</button>
          <button class="tab" data-tab="prompt">Prompt</button>
          <button class="tab" data-tab="notes">Примітки</button>
          <button class="tab" data-tab="comments">Коментарі</button>
          <button class="tab" data-tab="changes">Зміни</button>
          <button class="btn bottom-toggle" id="bottomToggle">⌄ Згорнути</button>
        </div>
        <div class="bottom-body" id="bottomBody"></div>
      </section>
    </section>
  </main>
</div>

<div class="modal" id="modal">
 <div class="modal-card">
  <h2 id="modalTitle">Додати</h2>
  <div id="modalContent"></div>
  <div class="modal-actions">
   <button class="btn" id="modalCancel">Скасувати</button>
   <button class="btn primary" id="modalSave">Зберегти</button>
  </div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY="beroo_project_map_v2";

const seed = {
 meta:{
   project:"BEROO",
   version:"1.0",
   purpose:"Візуальна карта великої CRM + creator marketplace + marketplace + аналітичний центр",
   attached_source:"beroo_settings_prompt.json — логіка статусів, меню, еквайрингу, дзеркал, Оглядача та Blogger PRO",
   principle:"Оглядач = базовий непрофесійний статус; Blogger Pro = повний професійний профіль з ФОП/документами та фінансовим функціоналом.",
   platform_role:"BEROO не є гарантом виплат, доставки, правдивості документів чи виконання домовленостей; платформа надає інструменти обліку, калькуляції, аналітики, запитів і взаємодії."
 },
 nodes:[
  {id:"platform",title:"BEROO",type:"entity",x:600,y:40,desc:"Єдина екосистема CRM, магазинів, блогерів, дзеркал, біржі, аналітики та сайтів.",tags:["ядро","marketplace","CRM"]},
  {id:"seller",title:"Продавець",type:"entity",x:210,y:190,desc:"Керує товарами, магазином, сайтом, еквайрингом, запитами блогерів та аналітикою.",tags:["сутність"]},
  {id:"blogger",title:"Блогер",type:"entity",x:990,y:190,desc:"Може бути Оглядачем або Blogger Pro; може одночасно бути продавцем.",tags:["сутність"]},
  {id:"store",source:"attached-json",title:"Магазин",type:"module",x:40,y:390,desc:"Має статус без еквайрингу або з активованим еквайрингом. Ручна оплата через IBAN доступна без еквайрингу.",tags:["магазин"]},
  {id:"reviewer",source:"attached-json",title:"Оглядач",type:"module",x:770,y:390,desc:"Базовий, неповний профіль. Соцмережі, досвід і 3 успішні TikTok-відео. Без професійних фінансових інструментів.",tags:["база","обмеження"]},
  {id:"pro",source:"attached-json",title:"Blogger Pro",type:"module",x:1160,y:390,desc:"Повний професійний профіль після внесення/перевірки документів ФОП у вкладці Оплата.",tags:["PRO","ФОП"]},
  {id:"mirror",source:"attached-json",title:"Дзеркало",type:"module",x:440,y:555,desc:"Механіка копіювання товарів/магазину блогером. Джерело: Магазини, Вітрина або реферальне посилання продавця.",tags:["mirror"]},
  {id:"showcase",title:"Вітрина",type:"module",x:40,y:700,desc:"Великий каталог товарів усіх магазинів. Оглядачі й Pro бачать товари, купують та можуть подавати запит на віддзеркалення.",tags:["marketplace"]},
  {id:"stores",title:"Дзеркало → Магазини",type:"module",x:300,y:700,desc:"Оглядачі та Pro можуть переглядати магазини, рейтинг і подавати запити на віддзеркалення.",tags:["discovery"]},
  {id:"exchange",source:"attached-json",title:"Дзеркало → Блогери",type:"module",x:1030,y:570,desc:"Публічна біржа Blogger Pro. Магазини з активним режимом та хоча б одним товаром можуть шукати Pro-блогерів і надсилати запити.",tags:["біржа","PRO"]},
  {id:"reviewers",title:"Магазин → Оглядачі",type:"module",x:790,y:720,desc:"Не публічна біржа. Відображаються лише оглядачі-підписники магазину: через запит + підтвердження або запрошувальне посилання.",tags:["закрито"]},
  {id:"invite",title:"Запрошення продавця",type:"module",x:1060,y:745,desc:"Унікальне реферальне посилання. Перехід відкриває реєстрацію блогера та після генерації автоматично розгортає товари оригінального магазину.",tags:["referral"]},
  {id:"payment",title:"Оплата / Фінанси",type:"module",x:1370,y:390,desc:"IBAN ФОП, еквайринг, комісії, запити на виплату та фінансова аналітика. Розширюється для Blogger Pro.",tags:["finance"]},
  {id:"analytics",title:"Аналітичний центр",type:"analytics",x:1370,y:570,desc:"GMV, продажі, кількість товарів, суми, кліки, конверсії, повернення, рейтинг, статистика по магазинах/товарах/блогерах.",tags:["data","BI"]},
  {id:"rating",title:"Рейтинги / Репутація",type:"analytics",x:1370,y:745,desc:"Рейтинг блогера: зйомка, кліки, конверсія, продажі, повернення/обміни, виконання. Рейтинг магазинів і товарів. Публічні скарги/сигнали — напрям для уточнення.",tags:["trust"]},
  {id:"sites",title:"Сайти / Міні-сайти",type:"module",x:390,y:830,desc:"Кожен зареєстрований користувач може створити сайт. Продавець розгортає магазин; блогер — власну вітрину/контент.",tags:["site-builder"]},

function applyProjectLogic(){
  // Logic from the attached BEROO settings JSON is represented as overlays.
  // Conflicts are intentionally visible rather than silently merged.
  const overlay = {
    seller:["Еквайринг","Лише дзеркала","Без еквайрингу = лише картка магазину","Оглядачі магазину"],
    reviewer:["Базова анкета","Обмежені фінанси","Запити до магазинів","Не публічна біржа"],
    pro:["ФОП / верифікація","Повний професійний функціонал","Публічна біржа","Виплати"],
    exchange:["Blogger PRO only","Магазин має мати активний режим + ≥1 товар"],
    mirror:["Еквайринг → товари/категорії/магазин","Без еквайрингу → лише картка магазину"],
    sites:["Три режими нижнього меню сайту залежать від ролей"],
    risk:["BEROO не гарант виплати/доставку/правдивість документів"]
  };
  state.nodes.forEach(n=>n.logic=overlay[n.id]||n.logic||[]);
  // Attached JSON introduces a strong constraint that can conflict with an earlier broad rule:
  // "Оглядач can mirror products from any store" vs "store without acquiring = only store card".
  const conflictId="conflict_acquiring";
  if(!state.nodes.some(n=>n.id===conflictId)){
    state.nodes.push({
      id:conflictId,title:"⚠ Конфлікт: Віддзеркалення без еквайрингу",type:"risk",
      x:430,y:410,
      desc:"Базова карта допускає дзеркалення товарів, але прикріплений JSON уточнює: магазин без еквайрингу може віддавати лише картку магазину. Потрібне єдине правило.",
      tags:["CONFLICT","OPEN DECISION","еквайринг"]
    });
    state.edges.push(["store",conflictId],["reviewer",conflictId],["pro",conflictId]);
  }
  const decisionId="decision_public_reviewers";
  if(!state.nodes.some(n=>n.id===decisionId)){
    state.nodes.push({
      id:decisionId,title:"OPEN DECISION: Оглядачі / публічність",type:"risk",
      x:790,y:545,
      desc:"JSON підтверджує: Оглядачі не входять у публічну біржу, але можуть бачити Pro-блогерів і рейтинги. Треба зафіксувати правила видимості назавжди.",
      tags:["OPEN DECISION","visibility"]
    });
    state.edges.push(["reviewer",decisionId],["exchange",decisionId],["reviewers",decisionId]);
  }
}

function handleMagnet(nodeId,side){
  if(!wireStart){
    wireStart={nodeId,side};
    toast("Оберіть другий магніт для під'єднання провідка");
    render();
    return;
  }
  if(wireStart.nodeId===nodeId){wireStart=null;toast("Провідок скасовано");render();return}
  const from=wireStart.side==="right"?wireStart.nodeId:nodeId;
  const to=wireStart.side==="right"?nodeId:wireStart.nodeId;
  const exists=state.edges.some(e=>e[0]===from&&e[1]===to);
  if(!exists){
    state.edges.push([from,to]);
    state.changes.push({at:new Date().toISOString(),action:"connect_wire",node:from,summary:`Під'єднано провідок: ${nodeBy(from)?.title} → ${nodeBy(to)?.title}`});
  }
  wireStart=null;save();
}
function makeDraggable(el,n){
  let down=false,sx=0,sy=0,ox=0,oy=0;
  el.addEventListener("pointerdown",e=>{
    if(e.button!==0 || e.target.classList.contains("magnet"))return;
    down=true;el.setPointerCapture(e.pointerId);
    sx=e.clientX;sy=e.clientY;ox=n.x;oy=n.y;
  });
  el.addEventListener("pointermove",e=>{
    if(!down)return;n.x=Math.max(0,ox+(e.clientX-sx)/zoom);n.y=Math.max(0,oy+(e.clientY-sy)/zoom);
    el.style.left=n.x+"px";el.style.top=n.y+"px";drawEdgesOnly();
  });
  el.addEventListener("pointerup",()=>{if(down){down=false;save();}});
}
function drawEdgesOnly(){
  const edges=document.getElementById("edges"); edges.innerHTML="";
  edges.setAttribute("width","1700"); edges.setAttribute("height","1100");
  const defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
  defs.innerHTML='<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3c7fe8"/></marker>';
  edges.appendChild(defs);

  state.edges.forEach(([a,b])=>{
    const A=nodeBy(a), B=nodeBy(b); if(!A||!B) return;
    // Always attach to the physically nearest left/right magnet.
    const AonLeft = B.x < A.x;
    const x1=A.x+(AonLeft?0:245), y1=A.y+55;
    const x2=B.x+(AonLeft?245:0), y2=B.y+55;
    const dir=AonLeft?-1:1;
    const dx=Math.max(55,Math.min(180,Math.abs(x2-x1)*0.42));
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",`M ${x1} ${y1} C ${x1+dir*dx} ${y1}, ${x2-dir*dx} ${y2}, ${x2} ${y2}`);
    p.setAttribute("class","edge"+(selectedId&&(a===selectedId||b===selectedId)?" active":""));
    p.setAttribute("marker-end","url(#arrow)");
    edges.appendChild(p);

    // Blue dot = connected.
    const dot=document.createElementNS("http://www.w3.org/2000/svg","circle");
    dot.setAttribute("cx",x1); dot.setAttribute("cy",y1); dot.setAttribute("r","5");
    dot.setAttribute("class","edge-dot connected"); edges.appendChild(dot);
  });

  if(wireStart){
    const N=nodeBy(wireStart.nodeId);
    if(N){
      const x=N.x+(wireStart.side==="right"?245:0), y=N.y+55;
      const dir=wireStart.side==="right"?1:-1;
      const p=document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("d",`M ${x} ${y} C ${x+dir*70} ${y}, ${x+dir*150} ${y}, ${x+dir*210} ${y}`);
      p.setAttribute("class","edge pending"); edges.appendChild(p);
      const dot=document.createElementNS("http://www.w3.org/2000/svg","circle");
      dot.setAttribute("cx",x+dir*70); dot.setAttribute("cy",y); dot.setAttribute("r","5");
      dot.setAttribute("class","edge-dot"); edges.appendChild(dot);
    }
  }
}

function promptText(){
 return `Ти працюєш над продуктом BEROO — великою CRM + marketplace платформою.

КОНТЕКСТ:
- Є сутності Продавець, Блогер та Магазин.
- Кожен користувач може мати сайт/міні-сайт і може бути одночасно продавцем і блогером.
- Продавець керує товарами, магазином, CRM, аналітикою та еквайрингом.
- Блогер має статус Оглядач або Blogger Pro.
- Оглядач — базовий непрофесійний рівень: базові дані, посилання на соцмережі, досвід, 3 поля для успішних TikTok-відео. Без професійного фінансового функціоналу.
- Blogger Pro — повний професійний профіль, ФОП-документи, IBAN, професійні параметри, комісії, виплати, розширена аналітика та публічна біржа Pro.
- Для Pro документи та платіжні дані вводяться у вкладці Оплата; після виконання вимог розширена частина Анкети активується.
- Вітрина містить товари всіх магазинів. Через Вітрину, Магазини або реферальне запрошення можна розгорнути Дзеркало.
- Оглядачі можуть дивитися Вітрину, магазини, рейтинги та дзеркалити товари, але не потрапляють у публічну біржу блогерів.
- Магазин бачить Оглядачів лише серед своїх підписників/запрошених.
- Blogger Pro доступний у публічній біржі для магазинів, які активували режим магазину та мають хоча б один товар.
- Магазин відправляє товар. Платформа не гарантує виплати, доставку, правдивість документів чи виконання домовленостей; вона надає інструменти обліку, калькуляції, аналітики та взаємодії.
- Для Оглядача комісія є довідковою/середньою і не редагується; виплати недоступні.
- Для Pro доступні професійні комісії, фінансові запити та розширена аналітика.
- У перспективі: рейтинги, повернення, GMV, кліки, конверсії, реклама, таргет, просування, тарифи, API, аналітичний центр.

ЗАВДАННЯ:
1. Не ламати існуючу логіку.
2. Будь-яку нову функцію додавати як окремий модуль/підрозділ із залежностями.
3. Чітко розділяти права Оглядача, Blogger Pro та Продавця.
4. Враховувати мобільний UX, фільтри, аналітику, аудити, статуси, ризики та масштабування.
5. Виявляти місця, де потрібне бізнес-рішення, і позначати їх як OPEN DECISION.
6. Вихід: структурований JSON з entities, modules, permissions, workflows, metrics, risks, open_decisions, changes та notes.`;
}

  const names={
    module:["Новий модуль","Функціональний блок BEROO"],
    entity:["Нова сутність","Сутність проєкту"],
    list:["Новий блок-список","Комод із підрозділами"],
    analytics:["Нова аналітика","Метрики / KPI / BI"],
    risk:["Новий ризик","Конфлікт або зона ризику"],
    decision:["OPEN DECISION","Бізнес-рішення потребує уточнення"]
  };
  const [title,desc]=names[template]||names.module;
  const id="n_"+Date.now();
  const type=template==="entity"?"entity":template==="analytics"?"analytics":(template==="risk"||template==="decision")?"risk":"module";
  const tags=template==="decision"?["OPEN DECISION"]:template==="risk"?["CONFLICT"]:template==="list"?["LIST","структура"]:[];
  const n={id,title,type,x:350+Math.random()*750,y:240+Math.random()*560,desc,tags,logic:[]};
  state.nodes.push(n);
  state.changes.push({at:new Date().toISOString(),action:"quick_add",node:id,summary:`Швидко додано ${title}`});
  closeQuickDrawer();selectNode(id);save();
}
function closeQuickDrawer(){document.getElementById("quickDrawer").classList.remove("open")}
document.getElementById("quickAddBtn").onclick=()=>document.getElementById("quickDrawer").classList.toggle("open");
document.getElementById("addListBtn").onclick=()=>addTemplate("list");
document.querySelectorAll(".template").forEach(b=>b.onclick=()=>addTemplate(b.dataset.template));

/* Canvas pan + wheel zoom */
const canvas=document.getElementById("canvas");
const inner=document.getElementById("canvasInner");
function applyTransform(){
  inner.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  document.getElementById("zoomLabel").textContent=Math.round(zoom*100)+"%";
}
canvas.addEventListener("pointerdown",e=>{
  if(e.target.closest(".node") || e.target.closest(".map-controls") || e.target.closest(".drawer")) return;
  draggingCanvas=true; lastPointer={x:e.clientX,y:e.clientY}; canvas.classList.add("dragging");
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{
  if(!draggingCanvas)return;
  panX+=e.clientX-lastPointer.x; panY+=e.clientY-lastPointer.y;
  lastPointer={x:e.clientX,y:e.clientY}; applyTransform();
});
function stopPan(){draggingCanvas=false;canvas.classList.remove("dragging")}
canvas.addEventListener("pointerup",stopPan);canvas.addEventListener("pointercancel",stopPan);
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const old=zoom, next=Math.min(2.5,Math.max(.35,zoom*(e.deltaY<0?1.12:.89)));
  panX=mx-(mx-panX)*(next/old); panY=my-(my-panY)*(next/old); zoom=next; applyTransform();
},{passive:false});
function setZoom(next){zoom=Math.min(2.5,Math.max(.35,next));applyTransform()}
document.getElementById("zoomIn").onclick=()=>setZoom(zoom*1.15);
document.getElementById("zoomOut").onclick=()=>setZoom(zoom*.87);
document.getElementById("zoomFit").onclick=()=>{
  const xs=state.nodes.map(n=>n.x), ys=state.nodes.map(n=>n.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs)+245, minY=Math.min(...ys), maxY=Math.max(...ys)+120;
  const cw=canvas.clientWidth-60,ch=canvas.clientHeight-60;
  zoom=Math.min(1.1,Math.max(.45,Math.min(cw/(maxX-minX),ch/(maxY-minY))));
  panX=30-minX*zoom; panY=30-minY*zoom; applyTransform();
};
document.getElementById("bottomToggle").onclick=()=>{
  const b=document.querySelector(".bottom");b.classList.toggle("collapsed");
  document.getElementById("bottomToggle").textContent=b.classList.contains("collapsed")?"⌃ Розгорнути":"⌄ Згорнути";
};

render();
document.getElementById("zoomFit").click();
</script>
