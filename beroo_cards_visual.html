<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEROO — Маркетплейс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181A1F; --ink-soft:#565B66; --ink-faint:#8C919C;
    --paper:#F7F5F2; --card:#FFFFFF; --line:#E9E5DC;
    --primary:#E8505B; --primary-bg:#FDEAEC; --primary-dark:#C93E49;
    --gold:#B8860B; --gold-bg:#FBF1DD;
    --grey-star:#9AA0AC; --grey-star-bg:#EEF0F3;
    --violet:#7C5CBF; --violet-bg:#F1EBFB;
    --green:#2E7D32; --green-bg:#E8F5E9;
    --orange:#B8720A; --orange-bg:#FFF3E0;
    --black-zone:#1A1A1A; --black-zone-bg:#EDEDED;
    --radius:20px;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F3F1EC; --ink-soft:#A8ADB8; --ink-faint:#767B85; --paper:#131418; --card:#1E2026; --line:#31333B;
      --primary-bg:#3A1B1E; --gold-bg:#332A16; --grey-star-bg:#2A2C33; --violet-bg:#2A2338; --green-bg:#16261A; --orange-bg:#2E2013; --black-zone-bg:#2A2A2A;
    }
  }
  :root[data-theme="dark"]{
    --ink:#F3F1EC; --ink-soft:#A8ADB8; --ink-faint:#767B85; --paper:#131418; --card:#1E2026; --line:#31333B;
    --primary-bg:#3A1B1E; --gold-bg:#332A16; --grey-star-bg:#2A2C33; --violet-bg:#2A2338; --green-bg:#16261A; --orange-bg:#2E2013; --black-zone-bg:#2A2A2A;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  html{scroll-padding-top:calc(var(--safe-t) + 8px);}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--font);
    padding-top:var(--safe-t); padding-bottom:var(--safe-b);
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }
  button,input{font-family:var(--font);}

  /* ---------- shell ---------- */
  .topbar{background:var(--paper); padding:14px 14px 0;}
  .masthead{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .info-btn{flex:none; display:flex; align-items:center; gap:5px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); border-radius:999px; padding:6px 12px 6px 10px; font-size:11.5px; font-weight:600; cursor:pointer;}
  .info-btn span{font-size:13px; color:var(--primary);}
  .masthead h1{font-size:18px; font-weight:800; margin:0; letter-spacing:-0.01em;}
  .masthead .sub{font-size:11px; color:var(--ink-faint);}

  .switch-row{display:flex; gap:6px; margin-bottom:10px;}
  .pillset{display:flex; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px; flex:1;}
  .pillset button{
    flex:1; appearance:none; border:none; background:transparent; color:var(--ink-soft);
    font-size:12.5px; font-weight:600; padding:8px 6px; border-radius:999px; cursor:pointer;
    transition:background .15s ease, color .15s ease; white-space:nowrap;
  }
  .pillset button.active{background:var(--ink); color:var(--paper);}

  /* toolbar (Блок керування мобільна версія) */
  .toolbar{padding:2px 0 10px;}
  .search-row{position:relative; margin-bottom:8px;}
  .search-row input{
    width:100%; border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:12px; padding:10px 12px 10px 34px; font-size:13.5px; outline:none;
  }
  .search-row input:focus{border-color:var(--primary);}
  .search-row .icon{position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--ink-faint);}

  .counts-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
  .count-chip{font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:999px;}
  .count-chip.fill{background:var(--ink); color:var(--paper);}
  .count-chip.outline{background:var(--card); color:var(--ink-soft); border:1px solid var(--line);}
  .count-chip.tint{background:var(--primary-bg); color:var(--primary-dark); border:1px solid transparent;}
  .count-chip.outline.gold{background:var(--gold-bg); color:var(--gold); border:1px solid #EAD9A8;}
  .count-chip.zone-chip.zone-green{background:var(--green-bg); color:var(--green); border:1px solid transparent;}
  .count-chip.zone-chip.zone-orange{background:var(--orange-bg); color:var(--orange); border:1px solid transparent;}
  .count-chip.zone-chip.zone-black{background:var(--black-zone-bg); color:var(--black-zone); border:1px solid transparent;}

  .chip-scroll{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:8px; scrollbar-width:none;}
  .chip-scroll::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:999px;
    background:var(--card); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .chip-scroll.dimmed{opacity:.4;}

  .chip.coop-all.active{background:#fff; color:var(--ink); border:1px solid var(--ink);}
  .chip.coop-all:not(.active){background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .chip.coop-yes.active{background:var(--gold-bg); color:var(--gold); border:1px solid #EAD9A8;}
  .chip.coop-yes:not(.active){background:var(--card); color:var(--ink-soft); border:1px solid var(--line);}
  .chip.coop-fav{padding:6px 11px; font-size:14px;}
  .chip.coop-fav.active{color:#D1495B; background:var(--card); border-color:#F1C6CD;}

  .util-btn.icon-only{flex:none; width:40px; padding:0; height:40px; display:flex; align-items:center; justify-content:center; font-size:15px;}
  .filter-dot{position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--primary);}
  .filter-actions{display:flex; gap:8px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line);}
  .filter-actions .btn{padding:10px;}

  .util-row{display:flex; gap:8px;}
  .search-filter-row{display:flex; gap:8px; margin-bottom:8px;}
  .filter-section-title{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin:12px 0 4px;}
  .filter-drawer .filter-section-title:first-child{margin-top:0;}
  .util-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    border-radius:11px; padding:9px 8px; font-size:11.5px; font-weight:600; cursor:pointer;
  }
  .util-btn.on{background:var(--primary-bg); border-color:var(--primary); color:var(--primary);}
  .util-btn .spin{display:inline-block;}
  .util-btn .spin.spinning{animation:spin .6s linear;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .filter-drawer{display:none; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; font-size:12.5px;}
  .filter-drawer.open{display:block;}
  .filter-drawer label{display:flex; align-items:center; gap:8px; padding:5px 0; color:var(--ink-soft); cursor:pointer;}
  .filter-drawer input[type="checkbox"]{width:16px;height:16px;accent-color:var(--primary);}

  /* ---------- list area ---------- */
  .list-wrap{padding:2px 14px 40px;}
  .empty{text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:13px;}

  /* Спрощений: tile grid */
  .tile-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .tile{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px;
    display:flex; flex-direction:column; gap:6px; position:relative;
  }
  .tile .photo{
    width:100%; aspect-ratio:1.4/1; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:26px; background:var(--grey-star-bg); border:1px solid var(--line);
  }
  .tile .photo.avatar-shop{border-radius:999px; background:linear-gradient(155deg,#FBD7DE,var(--card));}
  .tile .photo.avatar-blogger{border-radius:999px; background:linear-gradient(155deg,#D9E4FB,var(--card));}  .tile .t-name{font-size:12.5px; font-weight:700; line-height:1.3; margin:0; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;}
  .tile .t-stat{font-size:12px; color:var(--ink-soft); font-weight:600;}
  .tile .t-stat-metric{color:var(--primary); font-size:11px;}
  .tile .t-foot-row{display:flex; align-items:center; justify-content:space-between; margin-top:2px;}
  .tile .t-code{font-size:9.5px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:66%;}
  .tile .t-more{
    border:none; background:var(--ink); color:var(--paper); width:26px; height:26px; border-radius:50%;
    font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .tile-fav{
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft); width:26px; height:26px; border-radius:50%;
    font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .tile-fav.on{color:#D1495B; border-color:#F1C6CD;}

  /* Розширений: full cards feed */
  .feed{display:flex; flex-direction:column; gap:14px;}

  /* ---------- full card component (shared by modal + feed) ---------- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .card-head{display:flex; gap:14px; padding:16px 44px 20px 16px; align-items:flex-start; position:relative;}
  .card-head.centered{align-items:center;}
  .head-photo-col{display:flex; flex-direction:column; align-items:center; gap:5px; flex:none;}
  .code-under{font-size:10px;}
  .code-link{color:var(--primary); text-decoration:none; font-weight:600;}
  .code-link:hover{text-decoration:underline;}
  .photo-lg{width:70px;height:70px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--grey-star-bg);border:1px solid var(--line);}
  .photo-lg.avatar-shop{border-radius:999px; background:linear-gradient(155deg,#FBD7DE,var(--card));}
  .photo-lg.avatar-blogger{border-radius:999px; background:linear-gradient(155deg,#D9E4FB,var(--card));}
  .head-main{flex:1;min-width:0;}
  .name{font-size:16px;font-weight:700;line-height:1.25;margin:0;letter-spacing:-0.005em;}
  .fav{margin-left:auto;flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--ink-soft);}
  .fav.on{color:#D1495B;border-color:#F1C6CD;}
  .meta-line{font-size:12px;color:var(--ink-soft);margin:4px 0 0;line-height:1.5;}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .badge{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;}
  .badge.gold{background:var(--gold-bg);color:var(--gold);border:1px solid #EAD9A8;}
  .badge.grey{background:var(--grey-star-bg);color:var(--grey-star);border:1px solid var(--line);}
  .badge.violet{background:var(--violet-bg);color:var(--violet);border:1px solid transparent;}
  .badge.status{background:var(--grey-star-bg);color:var(--ink-soft);border:1px solid var(--line);}
  .card-top-right{position:absolute; top:12px; right:14px; display:flex; align-items:center; gap:6px; max-width:calc(100% - 90px);}
  .site-addr-link{font-size:10px; color:var(--primary); text-decoration:none; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .site-addr-link:hover{text-decoration:underline;}
  .rating-badge{flex:none; font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;}
  .rating-badge.zone-green{background:var(--green-bg); color:var(--green);}
  .rating-badge.zone-orange{background:var(--orange-bg); color:var(--orange);}
  .rating-badge.zone-black{background:var(--black-zone-bg); color:var(--black-zone);}
  .fav-corner{position:absolute; bottom:6px; right:14px;}

  .panels{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .panel{background:var(--card); padding:10px 6px; text-align:center;}
  .panel .val{font-size:13px;font-weight:800;letter-spacing:-0.01em;line-height:1.25;}
  .panel .lab{font-size:9px;color:var(--ink-faint);margin-top:3px;line-height:1.25;text-transform:uppercase;letter-spacing:.04em;}
  .panel-extra{font-size:10px;font-weight:800;color:var(--gold);margin-top:4px;letter-spacing:.01em;}
  .panel.zone-green{background:var(--green-bg);} .panel.zone-green .val{color:var(--green);}
  .panel.zone-orange{background:var(--orange-bg);} .panel.zone-orange .val{color:var(--orange);}
  .panel.zone-black{background:var(--black-zone-bg);} .panel.zone-black .val{color:var(--black-zone);}
  .panel.gold .val{color:var(--gold);}
  .panel.grey .val{color:var(--grey-star);}

  .risk-row{display:flex; align-items:center; justify-content:space-between; padding:12px 16px 4px;}
  .risk-row .risk-name{font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; font-weight:700;}
  .risk-pill{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; font-size:12px; font-weight:700;}
  .risk-pill .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .risk-pill.zone-green{background:var(--green-bg);color:var(--green);} .risk-pill.zone-green .dot{background:var(--green);}
  .risk-pill.zone-orange{background:var(--orange-bg);color:var(--orange);} .risk-pill.zone-orange .dot{background:var(--orange);}
  .risk-pill.zone-black{background:var(--black-zone-bg);color:var(--black-zone);} .risk-pill.zone-black .dot{background:var(--black-zone);}
  .risk-bar{height:4px; border-radius:99px; background:linear-gradient(90deg,var(--green) 0%, var(--orange) 55%, var(--black-zone) 100%); margin:8px 16px 4px; position:relative;}
  .risk-bar .marker{position:absolute; top:-3px; width:10px; height:10px; border-radius:50%; background:var(--card); border:2px solid var(--ink); transform:translateX(-50%);}

  .earn-box{margin:2px 16px 4px; padding:11px 13px; background:var(--gold-bg); border-radius:13px;}
  .earn-box .earn-top{display:flex; align-items:center; justify-content:space-between;}
  .earn-box .earn-label{font-size:10px; color:var(--gold); text-transform:uppercase; letter-spacing:.04em; font-weight:700;}
  .earn-box .earn-val{font-size:15px; font-weight:800; color:var(--ink);}
  .earn-box .earn-formula{font-size:10.5px; color:var(--ink-soft); margin-top:4px;}

  .foot{padding:12px 16px; font-size:12.5px; line-height:1.5; color:var(--ink-soft);}

  .expand-toggle{width:calc(100% - 32px); margin:0 16px 10px; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:10px; font-size:12px; font-weight:700; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;}
  .expand-body{display:none; padding:2px 16px 14px; font-size:12px; color:var(--ink-soft); line-height:1.6; border-top:1px solid var(--line);}
  .expand-body.open{display:block;}
  .expand-body dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;}
  .expand-body dt{color:var(--ink);font-weight:600;white-space:nowrap;}
  .expand-body dd{margin:0;}
  .complaint{margin-top:10px; font-size:11px; color:var(--ink-faint); display:flex; align-items:center; gap:5px; cursor:pointer; width:fit-content;}

  .actions{display:flex; gap:7px; padding:12px 16px 16px;}
  .btn{flex:1; border:none; border-radius:11px; padding:10px 8px; font-size:11.5px; font-weight:700; cursor:pointer; text-align:center;}
  .btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--line);}
  .btn.primary{background:var(--primary); color:#fff;}
  .btn.warn{background:var(--card); color:var(--primary); border:1px solid var(--primary-bg);}
  .btn.muted{background:var(--grey-star-bg); color:var(--ink-soft); cursor:pointer;}
  .btn.yellow{background:var(--card); color:var(--gold); border:1px solid #EAD9A8; cursor:pointer;}

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,10,14,.55); z-index:100;
    display:none; align-items:center; justify-content:center;
    padding:20px;
  }
  .modal-backdrop.open{display:flex;}
  .modal-sheet{
    width:100%; max-width:440px; max-height:85vh; overflow-y:auto;
    background:var(--paper); border-radius:22px; padding:10px 0 0;
    animation:popIn .18s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:.4;} to{transform:translateY(0); opacity:1;}}
  .info-centered{animation:popIn .18s ease;}
  @keyframes popIn{from{transform:scale(.94); opacity:0;} to{transform:scale(1); opacity:1;}}
  .modal-handle{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 10px;}
  .modal-close{position:absolute; top:10px; right:14px; width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:15px;cursor:pointer; z-index:20; box-shadow:0 1px 4px rgba(0,0,0,.15);}
  .modal-inner{padding:0 14px 18px; position:relative;}

  .page-note{font-size:11.5px; color:var(--ink-faint); line-height:1.6; padding:2px 2px 16px;}

  .review-add-box{background:var(--gold-bg); border-radius:14px; padding:13px; margin-bottom:16px;}
  .review-add-label{font-size:12.5px; font-weight:700; color:var(--ink); margin-bottom:8px;}
  .review-add-box textarea{width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-family:var(--font); font-size:13px; color:var(--ink); background:var(--card); resize:vertical;}
  .star-picker{display:flex; gap:4px; margin-bottom:9px;}
  .star-pick{border:none; background:transparent; font-size:22px; line-height:1; color:var(--ink-faint); cursor:pointer; padding:2px;}
  .star-pick.on{color:var(--gold);}
  .review-lock-box{background:var(--grey-star-bg); border-radius:14px; padding:13px; margin-bottom:16px;}
  .review-lock-text{font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
  .review-list-label{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:8px;}
  .review-row{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; display:flex; gap:10px;}
  .review-avatar-col{flex:none; width:46px; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .review-avatar{width:36px; height:36px; border-radius:50%; background:var(--grey-star-bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:16px;}
  .review-author-stat{font-size:9px; font-weight:700; color:var(--gold); text-align:center; line-height:1.2;}
  .review-body{flex:1; min-width:0;}
  .review-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; gap:6px;}
  .review-shop{font-size:12.5px; font-weight:700; color:var(--ink);}
  .review-like{flex:none; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:3px 9px; font-size:11px; color:var(--ink-soft); cursor:pointer;}
  .review-like.liked{color:#D1495B; border-color:#F1C6CD;}
  .review-text{font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
  .shop-link-row{width:100%; display:flex; align-items:center; justify-content:space-between; background:var(--paper); border:1px solid var(--line); border-radius:11px; padding:10px 12px; margin-bottom:6px; font-size:12.5px; color:var(--ink); cursor:pointer;}
  .shop-link-row b{font-weight:700;}
  .shop-link-arrow{color:var(--ink-faint); font-size:15px;}
  .shop-link-stats{font-size:11px; color:var(--ink-faint); margin-bottom:12px; line-height:1.5;}
  .info-text p{font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin:0 0 12px;}
  .info-text b{color:var(--ink);}

  @media (min-width:460px){
    .tile-grid{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="masthead">
    <div>
      <h1>BEROO Маркетплейс</h1>
      <div class="sub">Тюнінг під iPhone 14 Pro · 393×852</div>
    </div>
    <button class="info-btn" id="infoBtn"><span>ⓘ</span> Як це працює</button>
  </div>

  <div class="switch-row">

  if(type==='shop'){
    const totalMirrors = item.greyMirrors + item.goldMirrors;
    return {
      icon:item.icon, code:'код '+item.code, name:item.name,
      meta:item.cats,
      badges:[{cls:'status', text: item.status==='eq'?'⚡ Платіжна система':'🏦 Ручна оплата'}],

      siteUrl: `https://${item.code}.beroo.online`,
      panels:[
        {val:item.items, lab:'товарів', cls:''},
        {val:item.variations, lab:'варіацій', cls:''},

        {val:item.returns+'%', lab:'повернень', cls: item.returns<=5?'zone-green':(item.returns<=15?'zone-orange':'zone-black')},
        {val:item.payoutsCount, lab:'виплат', cls:''}

    : {label:'Запросити', kind:'primary'};

    badges: item.hasShop ? [{cls:'violet', text:'має Магазин'}] : [],
    rating:item.commRating,
    siteDomain: item.code+'.beroo.online',
    siteUrl: `https://${item.code}.beroo.online/dzerkalo`,
    panels:[
      {val:formatStars(item.stars), lab:'золотих зірочок', cls:'gold', extra: item.cooperating ? ('ВАШИХ: ★ '+formatStars(item.yourStars).replace('★ ','')) : null},

      ['Середній час відповіді', item.responseTime],

    buttons:[{label:'Анкета',kind:'ghost'}, middleBtn, {label:'Відгуки',kind:'yellow',action:'openReviews',targetId:item.id,reviewType:'blogger'}]

}

function renderFullCard(type, item, opts){
  opts = opts || {};
  const m = cardModel(type, item);
  const isFav = !!state.fav[item.id];
  const isOpen = !!opts.expanded;
  const badgesHtml = m.badges.map(b=>`<span class="badge ${b.cls}">${b.text}</span>`).join('');
  const panelsHtml = m.panels.map(p=>`<div class="panel ${p.cls}"><div class="val">${p.val}</div><div class="lab">${p.lab}</div>${p.extra?`<div class="panel-extra">${p.extra}</div>`:''}</div>`).join('');
  const expandRows = m.expand.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');
  const buttonsHtml = m.buttons.map(b=>`<button class="btn ${b.kind}" ${b.action?`data-action="${b.action}" data-target="${b.targetId}"${b.reviewType?` data-review-type="${b.reviewType}"`:''}`:''}>${b.label}</button>`).join('');
  const photoClass = type==='shop' ? 'avatar-shop' : (type==='blogger' ? 'avatar-blogger' : '');
  const riskZoneCls = m.risk ? 'zone-'+m.risk.zone : '';
  const riskLabelText = m.risk ? (m.risk.zone==='green'?'Безпечна':(m.risk.zone==='orange'?'Увага':'Критична')) : '';
  const riskHtml = m.risk ? `
    <div class="risk-row">
      <span class="risk-name">${m.risk.label}</span>
      <span class="risk-pill ${riskZoneCls}"><span class="dot"></span>${m.risk.pct}% · ${riskLabelText}</span>
    </div>
    <div class="risk-bar"><span class="marker" style="left:${Math.min(96,Math.max(4,m.risk.pct))}%;"></span></div>
  ` : '';
  const earnHtml = m.earnings ? `
    <div class="earn-box">
      <div class="earn-top"><span class="earn-label">Заробіток за 1 продаж</span><span class="earn-val">★ ${m.earnings.stars}</span></div>
      <div class="earn-formula">Ціна ${m.earnings.price} ₴ × комісія ${m.earnings.comm}% = ${m.earnings.stars} зірочок (1★ = 1₴)</div>
    </div>
  ` : '';
  const metaHtml = m.metaLines
    ? m.metaLines.map(l=>`<p class="meta-line">${l}</p>`).join('')
    : `<p class="meta-line">${m.meta}</p>`;
  const isBloggerCard = type==='blogger';
  const ratingZone = m.rating==null ? null : (m.rating>=4.5?'green':(m.rating>=3.5?'orange':'black'));
  const ratingHtml = m.rating!=null ? `<span class="rating-badge zone-${ratingZone}">Рейтинг: ${m.rating.toFixed(1).replace('.',',')} бала</span>` : '';
  const siteAddrHtml = m.siteUrl ? `<a href="${m.siteUrl}" target="_blank" rel="noopener" class="site-addr-link" onclick="event.stopPropagation()">${m.siteDomain}</a>` : '';
  const topRightHtml = (siteAddrHtml || ratingHtml) ? `<div class="card-top-right">${siteAddrHtml}${ratingHtml}</div>` : '';
  return `
    <div class="card" data-id="${item.id}">
      <div class="card-head ${isBloggerCard?'centered':''}">
        ${topRightHtml}
        <div class="head-photo-col">
          <div class="photo-lg ${photoClass}">${m.icon}</div>
        </div>
        <div class="head-main">
          <p class="name">${m.name}</p>
          ${metaHtml}
          ${badgesHtml?`<div class="badges">${badgesHtml}</div>`:''}
        </div>
        <button class="fav fav-corner ${isFav?'on':''}" data-fav="${item.id}" aria-label="В обране">${isFav?'♥':'♡'}</button>
      </div>
      <div class="panels">${panelsHtml}</div>
      ${earnHtml}
      ${riskHtml}
      <div class="foot">${m.foot}</div>
      <button class="expand-toggle" data-expand="${item.id}">
        <span>${isOpen?'Згорнути':'Детальніше'}</span>
        <span style="transition:transform .2s ease; transform:rotate(${isOpen?180:0}deg);">▾</span>
      </button>
      <div class="expand-body ${isOpen?'open':''}">
        ${m.shopLink ? `
          <button class="shop-link-row" data-action="openShopFromProduct" data-target="${m.shopLink.id}">
            <span>Магазин: <b>${m.shopLink.name}</b></span>
            <span class="shop-link-arrow">›</span>
          </button>
          <div class="shop-link-stats">
            Рейтинг: ${m.shopLink.rating.toFixed(1).replace('.',',')} бала · ${m.shopLink.items} товарів · середній чек ≈ ${m.shopLink.avgCheck} ₴ · зразки: ${m.shopLink.samplesPolicy}
          </div>
        ` : ''}
        <dl>${expandRows}</dl>
        <div class="complaint">🚩 Подати скаргу</div>
      </div>
      <div class="actions">${buttonsHtml}</div>
    </div>
  `;
}

function renderTile(type, item){
  const m = cardModel(type, item);
  const photoClass = type==='shop' ? 'avatar-shop' : (type==='blogger' ? 'avatar-blogger' : '');
  const isFav = !!state.fav[item.id];
  const addrLinkHtml = m.siteUrl ? `<a href="${m.siteUrl}" target="_blank" rel="noopener" class="code-link" onclick="event.stopPropagation()">${m.siteDomain}</a>` : '';

  if(type==='blogger'){
    return `
      <div class="tile" data-id="${item.id}" data-open-modal="${item.id}" style="cursor:pointer;">
        <div class="photo ${photoClass}">${m.icon}</div>
        <p class="t-name">${m.name}</p>
        <div class="t-stat">${formatStars(item.stars)}</div>
        <div class="t-stat" style="color:var(--ink-faint);font-weight:600;">${item.returns}% повернень</div>
        <div class="t-foot-row">
          <span class="t-code">${addrLinkHtml}</span>
          <button class="tile-fav ${isFav?'on':''}" data-tile-fav="${item.id}" aria-label="В обране">${isFav?'♥':'♡'}</button>
        </div>
      </div>
    `;
  }

  const stat = type==='product' ? item.price+' ₴' : (item.status==='eq'?'⚡ Платіжна система':'🏦 Ручна оплата');
  const isFav2 = !!state.fav[item.id];
  let activeMetricHtml = '';
  if(type==='product'){
    const METRIC_INFO = {
      sold: {label:'Продано', get:i=>state.productPeriod==='3d'?i.sold3d:(state.productPeriod==='10d'?i.sold10d:(state.productPeriod==='30d'?i.sold30d:i.soldTotal)), unit:' шт'},
      stock: {label:'Лишилось', get:i=>i.stock, unit:' шт'},
      mirrors: {label:'Дзеркал', get:i=>i.mirrors, unit:''},
      favorites: {label:'Обрано', get:i=>i.favoritesCount, unit:''},
    };
    const mi = METRIC_INFO[state.sortId];
    if(mi) activeMetricHtml = `<div class="t-stat t-stat-metric">${mi.label}: ${mi.get(item).toLocaleString('uk-UA')}${mi.unit}</div>`;
  }
  return `
    <div class="tile" data-id="${item.id}" data-open-modal="${item.id}" style="cursor:pointer;">
      <div class="photo ${photoClass}">${m.icon}</div>
      <p class="t-name">${m.name}</p>
      <div class="t-stat">${stat}</div>
      ${activeMetricHtml}
      <div class="t-foot-row">
        <span class="t-code">${addrLinkHtml}</span>
        <button class="tile-fav ${isFav2?'on':''}" data-tile-fav="${item.id}" aria-label="В обране">${isFav2?'♥':'♡'}</button>
      </div>
    </div>
  `;
}

function zoneOf(type, item){
  if(type==='product') return item.shopRating>=95?'green':(item.shopRating>=90?'orange':'black');
  return item.returns<=5?'green':(item.returns<=15?'orange':'black');
}

function hasActiveDrawerFilters(){
  if(state.type==='product'){
    return state.filterOnlyStock || state.filterOnlyEq || state.productCategoryFilter.size>0 ||
      state.priceMin!=='' || state.priceMax!=='' || state.viewsMin!=='' || state.viewsMax!=='' ||
      state.productReturnsMin!=='' || state.productReturnsMax!=='';
  }
  if(state.type==='shop'){
    return state.filterOnlyEq;
  }
  if(state.type==='blogger'){
    return state.filterOnlyShop || state.categoryFilter.size>0 || state.sampleFilter.size>0 ||
      state.convMin!=='' || state.convMax!=='' || state.onSiteOnly || !!state.regionFilter;
  }
  return false;
}

/* ============ TOOLBAR ============ */
function renderToolbar(){
  const isBlogger = state.type === 'blogger';
  const isShop = state.type === 'shop';
  const sorts = SORTS[state.type];
  const isProduct = state.type === 'product';
  const dirAware = isBlogger || isProduct || isShop;
  const renderSortChips = (list) => list.map(s=>{
    const active = state.sortId===s.id;
    const arrow = active ? (state.sortDir==='desc' ? ' ↓' : ' ↑') : '';
    return `<button class="chip ${active?'active':''}" data-sort="${s.id}">${s.label}${arrow}</button>`;
  }).join('');
  const chips = dirAware
    ? renderSortChips(sorts)
    : sorts.map(s=>`<button class="chip ${state.sortId===s.id?'active':''}" data-sort="${s.id}">${s.label}</button>`).join('');
  const shopRow1Html = isShop ? renderSortChips(sorts.filter(s=>SHOP_SORT_ROW1_IDS.includes(s.id))) : '';
  const shopRow2Html = isShop ? renderSortChips(sorts.filter(s=>SHOP_SORT_ROW2_IDS.includes(s.id))) : '';

  const all = dataFor(state.type);
  const total = all.length;


  let coopRow = '';
  if(isBlogger){
    const coopN = all.filter(b=>b.cooperating).length;
    const notCoopN = total - coopN;
    coopRow = `
      <button class="chip coop-all ${state.coopFilter==='all'?'active':''}" data-coop="all">Усі ${total}</button>
      <button class="chip coop-fav ${state.favOnlyBlogger?'active':''}" data-coop="fav" aria-label="Обрані">${state.favOnlyBlogger?'♥':'♡'} ${all.filter(b=>state.fav[b.id]).length}</button>
      <button class="chip coop-yes ${state.coopFilter==='cooperating'?'active':''}" data-coop="cooperating">Співпрацюю ${coopN}</button>
      <button class="chip coop-no ${state.coopFilter==='not_cooperating'?'active':''}" data-coop="not_cooperating">Не співпрацюю ${notCoopN}</button>
    `;
  }

  const topActive = !!state.topMode;
  let periodRow = '';

    periodRow = `
      <button class="chip coop-yes ${state.topMode==='3d'?'active':''}" data-top="3d">Топ 3 дні</button>
      <button class="chip coop-yes ${state.topMode==='10d'?'active':''}" data-top="10d">Топ 10 днів</button>
      <button class="chip coop-yes ${state.topMode==='30d'?'active':''}" data-top="30d">Топ 30 днів</button>

  }

      <button class="chip coop-yes ${state.mirrorFilter==='mirroring'?'active':''}" data-mirror="mirroring">Дзеркалю ${mirroringN}</button>
      <button class="chip coop-no ${state.mirrorFilter==='not_mirroring'?'active':''}" data-mirror="not_mirroring">Не дзеркалю ${notMirroringN}</button>

        <input type="text" id="searchInput" placeholder="Пошук…" value="${state.search}">
      </div>
      <button class="util-btn ${state.filterOpen?'on':''}" id="filtersBtn" style="flex:none;width:auto;padding:10px 14px;position:relative;">🔍 Фільтри${hasActiveDrawerFilters()?'<span class="filter-dot"></span>':''}</button>
      <button class="util-btn icon-only" id="refreshBtn" aria-label="Оновити"><span class="spin" id="refreshSpin">↻</span></button>
    </div>
    <div class="filter-drawer ${state.filterOpen?'open':''}" id="filterDrawer">
      ${filterOptions}
      ${showDrawerButtons ? `<div class="filter-actions"><button class="btn ghost" id="filterCancelBtn">Скасувати</button><button class="btn primary" id="filterApplyBtn">Застосувати</button></div>` : ''}
    </div>
  `;

  document.querySelectorAll('.chip[data-sort]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(isProduct) state.topMode = null;
      if(isBlogger || isProduct || isShop){
        if(state.sortId === el.dataset.sort){
          if(state.sortDir==='desc'){ state.sortDir = 'asc'; }
          else { state.sortId = null; state.sortDir = 'desc'; }
        } else {
          state.sortId = el.dataset.sort;
          state.sortDir = 'desc';
        }
      } else {
        state.sortId = state.sortId===el.dataset.sort ? null : el.dataset.sort;
      }
      renderAll();
    });
  });
  document.querySelectorAll('.chip[data-coop]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const v = el.dataset.coop;
      if(v==='fav'){ state.favOnlyBlogger = !state.favOnlyBlogger; }
      else { state.coopFilter = v; }
      renderAll();
    });
  });
  document.querySelectorAll('.chip[data-top]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const v = el.dataset.top;
      state.topMode = state.topMode===v ? null : v;
      renderAll();
    });
  });
  document.querySelectorAll('.chip[data-mirror]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.topMode = null;
      const v = el.dataset.mirror;
      if(v==='fav'){ state.favOnlyProduct = !state.favOnlyProduct; }
      else { state.mirrorFilter = v; }
      renderAll();
    });
  });
  document.querySelectorAll('.chip[data-shopmirror]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const v = el.dataset.shopmirror;
      if(v==='fav'){ state.favOnlyShop = !state.favOnlyShop; }
      else { state.shopMirrorFilter = v; }
      renderAll();
    });
  });
  document.querySelectorAll('.chip[data-shoppay]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.shopPaymentFilter = el.dataset.shoppay;
      renderAll();
    });
  });
  document.querySelectorAll('.chip[data-prodpay]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.topMode = null;
      state.productPaymentFilter = el.dataset.prodpay;
      renderAll();
    });
  });
  document.querySelectorAll('.chip[data-platform]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.platform;
      if(id==='__all__') state.platformFilter.clear();
      else { state.platformFilter.has(id) ? state.platformFilter.delete(id) : state.platformFilter.add(id); }
      renderAll();
    });
  });
  document.querySelectorAll('.chip[data-format]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.format;
      if(id==='__all__') state.formatFilter.clear();
      else { state.formatFilter.has(id) ? state.formatFilter.delete(id) : state.formatFilter.add(id); }
      renderAll();
    });
  });
  document.getElementById('searchInput').addEventListener('input', e=>{
    if(isProduct) state.topMode = null;
    state.search = e.target.value;
    renderList();
  });
  document.getElementById('filtersBtn').addEventListener('click', ()=>{
    if(isProduct) state.topMode = null;
    if(!state.filterOpen){
      // opening — snapshot current filter state so Скасувати can restore it
      state._filterSnapshot = {
        filterOnlyStock: state.filterOnlyStock, filterOnlyEq: state.filterOnlyEq, filterOnlyShop: state.filterOnlyShop,
        categoryFilter: new Set(state.categoryFilter), sampleFilter: new Set(state.sampleFilter),
        convMin: state.convMin, convMax: state.convMax, onSiteOnly: state.onSiteOnly, regionFilter: state.regionFilter,
        productCategoryFilter: new Set(state.productCategoryFilter),
        priceMin: state.priceMin, priceMax: state.priceMax,
        viewsMin: state.viewsMin, viewsMax: state.viewsMax,
        productReturnsMin: state.productReturnsMin, productReturnsMax: state.productReturnsMax
      };
      state.filterOpen = true;
    } else {
      state.filterOpen = false;
    }
    renderAll();
  });
  document.getElementById('refreshBtn').addEventListener('click', ()=>{
    const s = document.getElementById('refreshSpin');
    s.classList.remove('spinning'); void s.offsetWidth; s.classList.add('spinning');
  });
  const cancelBtn = document.getElementById('filterCancelBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{
    const snap = state._filterSnapshot;
    if(snap){
      state.filterOnlyStock = snap.filterOnlyStock; state.filterOnlyEq = snap.filterOnlyEq; state.filterOnlyShop = snap.filterOnlyShop;
      state.categoryFilter = snap.categoryFilter; state.sampleFilter = snap.sampleFilter;
      state.convMin = snap.convMin; state.convMax = snap.convMax; state.onSiteOnly = snap.onSiteOnly; state.regionFilter = snap.regionFilter;
      state.productCategoryFilter = snap.productCategoryFilter;
      state.priceMin = snap.priceMin; state.priceMax = snap.priceMax;
      state.viewsMin = snap.viewsMin; state.viewsMax = snap.viewsMax;
      state.productReturnsMin = snap.productReturnsMin; state.productReturnsMax = snap.productReturnsMax;
    }
    state.filterOpen = false;
    renderAll();
  });
  const applyBtn = document.getElementById('filterApplyBtn');
  if(applyBtn) applyBtn.addEventListener('click', ()=>{
    state.filterOpen = false;
    renderAll();
  });
  ['fStock','fEq','fShop','fOnSite'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('change', e=>{
      if(id==='fStock') state.filterOnlyStock = e.target.checked;
      if(id==='fEq') state.filterOnlyEq = e.target.checked;
      if(id==='fShop') state.filterOnlyShop = e.target.checked;
      if(id==='fOnSite') state.onSiteOnly = e.target.checked;
      renderList();
    });
  });
  if(isBlogger){
    document.querySelectorAll('[data-cat-f]').forEach(el=>{
      el.addEventListener('change', e=>{
        const c = el.dataset.catF;
        e.target.checked ? state.categoryFilter.add(c) : state.categoryFilter.delete(c);
        renderList();
      });
    });
    document.querySelectorAll('[data-sample-f]').forEach(el=>{
      el.addEventListener('change', e=>{
        const s = el.dataset.sampleF;
        e.target.checked ? state.sampleFilter.add(s) : state.sampleFilter.delete(s);
        renderList();
      });
    });
    const convMinEl = document.getElementById('fConvMin'), convMaxEl = document.getElementById('fConvMax');
    if(convMinEl) convMinEl.addEventListener('input', e=>{ state.convMin = e.target.value; renderList(); });
    if(convMaxEl) convMaxEl.addEventListener('input', e=>{ state.convMax = e.target.value; renderList(); });
    const regionEl = document.getElementById('fRegion');
    if(regionEl) regionEl.addEventListener('change', e=>{ state.regionFilter = e.target.value; renderList(); });
  }
  if(isProduct){
    document.querySelectorAll('[data-pcat-f]').forEach(el=>{
      el.addEventListener('change', e=>{
        const c = el.dataset.pcatF;
        e.target.checked ? state.productCategoryFilter.add(c) : state.productCategoryFilter.delete(c);
        renderList();
      });
    });
    const pairs = [['fPriceMin','priceMin'],['fPriceMax','priceMax'],['fViewsMin','viewsMin'],['fViewsMax','viewsMax'],['fReturnsMin','productReturnsMin'],['fReturnsMax','productReturnsMax']];
    pairs.forEach(([elId, stateKey])=>{
      const el = document.getElementById(elId);
      if(el) el.addEventListener('input', e=>{ state[stateKey] = e.target.value; renderList(); });
    });
  }
  if(document.getElementById('myCatalogBtn')){
    document.getElementById('myCatalogBtn').addEventListener('click', ()=> alert('Веде на «Каталог → Товари/Послуги» цього блогера-продавця.'));
  }
}

  const regionOptions = ['<option value="">Будь-яка область</option>'].concat(UA_REGIONS.map(r=>`<option value="${r}" ${state.regionFilter===r?'selected':''}>${r}</option>`)).join('');

/* ============ LIST ============ */
function currentItems(){
  let items = dataFor(state.type).slice();

  if(state.type==='product' && state.topMode){
    const key = state.topMode==='3d' ? i=>i.sold3d : state.topMode==='10d' ? i=>i.sold10d : state.topMode==='30d' ? i=>i.sold30d : i=>i.soldTotal;
    return items.sort((a,b)=>key(b)-key(a));
  }

  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    items = items.filter(i => i.name.toLowerCase().includes(q));
  }
  if(state.type==='product'){
    if(state.filterOnlyStock) items = items.filter(i=>i.stock>0);
    if(state.filterOnlyEq) items = items.filter(i=>i.shopStatus==='eq');
    if(state.productPaymentFilter==='eq') items = items.filter(i=>i.paymentMethod==='eq'||i.paymentMethod==='both');
    if(state.productPaymentFilter==='iban') items = items.filter(i=>i.paymentMethod==='iban'||i.paymentMethod==='both');
    if(state.mirrorFilter==='mirroring') items = items.filter(i=>i.mirroring);
    if(state.mirrorFilter==='not_mirroring') items = items.filter(i=>!i.mirroring);
    if(state.favOnlyProduct) items = items.filter(i=>state.fav[i.id]);
    if(state.productCategoryFilter.size) items = items.filter(i=>state.productCategoryFilter.has(i.cat));
    if(state.priceMin !== '') items = items.filter(i=>i.price >= parseFloat(state.priceMin));
    if(state.priceMax !== '') items = items.filter(i=>i.price <= parseFloat(state.priceMax));
    if(state.viewsMin !== '') items = items.filter(i=>i.views >= parseFloat(state.viewsMin));
    if(state.viewsMax !== '') items = items.filter(i=>i.views <= parseFloat(state.viewsMax));
    if(state.productReturnsMin !== '') items = items.filter(i=>i.productReturns >= parseFloat(state.productReturnsMin));
    if(state.productReturnsMax !== '') items = items.filter(i=>i.productReturns <= parseFloat(state.productReturnsMax));
  }
  if(state.type==='shop'){
    if(state.filterOnlyEq) items = items.filter(i=>i.status==='eq');
    if(state.shopPaymentFilter==='eq') items = items.filter(i=>i.status==='eq');
    if(state.shopPaymentFilter==='iban') items = items.filter(i=>i.status==='iban');
    if(state.shopMirrorFilter==='mirroring') items = items.filter(i=>i.mirroring);
    if(state.shopMirrorFilter==='not_mirroring') items = items.filter(i=>!i.mirroring);
    if(state.favOnlyShop) items = items.filter(i=>state.fav[i.id]);
  }
  if(state.type==='blogger'){
    if(state.coopFilter==='cooperating') items = items.filter(i=>i.cooperating);
    if(state.coopFilter==='not_cooperating') items = items.filter(i=>!i.cooperating);
    if(state.favOnlyBlogger) items = items.filter(i=>state.fav[i.id]);
    if(state.filterOnlyShop) items = items.filter(i=>i.hasShop);
    if(state.platformFilter.size) items = items.filter(i=>i.platforms.some(p=>state.platformFilter.has(p)));
    if(state.formatFilter.size) items = items.filter(i=>i.formats.some(f=>state.formatFilter.has(f)));
    if(state.categoryFilter.size) items = items.filter(i=>i.cats.some(c=>state.categoryFilter.has(c)));
    if(state.sampleFilter.size) items = items.filter(i=>i.samples.some(s=>state.sampleFilter.has(s)));
    if(state.convMin !== '') items = items.filter(i=>i.conversion >= parseFloat(state.convMin));
    if(state.convMax !== '') items = items.filter(i=>i.conversion <= parseFloat(state.convMax));
    if(state.onSiteOnly) items = items.filter(i=>i.onSiteVisit);
    if(state.regionFilter) items = items.filter(i=>i.region===state.regionFilter);
  }

  const sortDef = SORTS[state.type].find(s=>s.id===state.sortId);
  if(sortDef){
    if(sortDef.filter) items = items.filter(sortDef.filter);
    if(state.type==='blogger' || state.type==='product' || state.type==='shop'){
      const dir = state.sortDir==='asc' ? 1 : -1;
      items.sort((a,b)=>{
        const ka=sortDef.key(a), kb=sortDef.key(b);
        if(typeof ka==='string') return dir*ka.localeCompare(kb);
        return dir*(ka-kb);
      });
    } else {
      items.sort((a,b)=>{
        const ka = sortDef.key(a), kb = sortDef.key(b);
        if(typeof ka === 'string') return ka.localeCompare(kb);
        return ka - kb;
      });
    }
  }
  return items;
}

function renderList(){
  const items = currentItems();
  const wrap = document.getElementById('listWrap');
  if(!items.length){
    wrap.innerHTML = `<div class="empty">Нічого не знайдено — спробуй інший запит або скинь фільтри.</div>`;
    return;
  }
  if(state.density === 'simple'){
    wrap.innerHTML = `<div class="tile-grid">${items.map(i=>renderTile(state.type,i)).join('')}</div>`;
    wrap.querySelectorAll('[data-open-modal]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.modalId = btn.dataset.openModal;
        state.modalExpanded = false;
        renderModal();
      });
    });
    wrap.querySelectorAll('[data-tile-fav]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = btn.dataset.tileFav;
        state.fav[id] = !state.fav[id];
        if(state.type==='blogger' || state.type==='product') renderToolbar();
        renderList();
      });
    });
  } else {
    wrap.innerHTML = `<div class="feed">${items.map(i=>renderFullCard(state.type,i,{expanded:!!state.expandedFeed[i.id]})).join('')}</div>`;
    wireCardEvents(wrap, false);
  }
}

function wireCardEvents(root, isModal){
  root.querySelectorAll('[data-fav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.fav;
      state.fav[id] = !state.fav[id];
      if(state.type==='blogger' || state.type==='product') renderToolbar();
      if(isModal) renderModal(); else renderList();
    });
  });
  root.querySelectorAll('[data-expand]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.expand;
      if(isModal){ state.modalExpanded = !state.modalExpanded; renderModal(); }
      else { state.expandedFeed[id] = !state.expandedFeed[id]; renderList(); }
    });
  });
  root.querySelectorAll('[data-action="goToMirrorsMe"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const b = BLOGGERS.find(x=>x.id===btn.dataset.target);
      alert('Веде на «Дзеркало → Мене дзеркалять», прокручує і розгортає картку «'+(b?b.name:'')+'» з кнопками Аналітика / Виплати.');
    });
  });
  root.querySelectorAll('[data-action="limitedRequest"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const b = BLOGGERS.find(x=>x.id===btn.dataset.target);
      if(b && b.requestRetryable){
        if(confirm('Цей блогер не відповідає вашим поточним критеріям запиту.\n\nСпробувати ще раз?')){
          alert('Запит надіслано повторно.');
        }
      } else {
        alert('Цей блогер не відповідає вашим поточним критеріям запиту.');
      }
    });
  });
  root.querySelectorAll('[data-action="openShopFromProduct"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const shopId = btn.dataset.target;
      state.type = 'shop';
      state.density = 'expanded';
      state.modalId = shopId;
      state.modalExpanded = false;
      renderAll();
      renderModal();
    });
  });
  root.querySelectorAll('[data-action="openReviews"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      state.reviewsFor = btn.dataset.target;
      state.reviewsForType = btn.dataset.reviewType;
      state.draftRating = 0;
      state.draftText = '';
      renderReviews();
    });
  });
}

/* ============ MODAL ============ */
function renderModal(){
  const backdrop = document.getElementById('modalBackdrop');
  if(!state.modalId){ backdrop.classList.remove('open'); return; }
  const item = dataFor(state.type).find(i=>i.id===state.modalId);
  const sheet = document.getElementById('modalSheet');
  sheet.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-inner">
      ${renderFullCard(state.type, item, {expanded: state.modalExpanded})}
      <button class="modal-close" id="modalCloseBtn">✕</button>
    </div>
  `;
  backdrop.classList.add('open');
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  wireCardEvents(sheet, true);
}
function closeModal(){ state.modalId = null; document.getElementById('modalBackdrop').classList.remove('open'); }

/* ============ REVIEWS POPUP ============ */
function renderReviews(){
  const backdrop = document.getElementById('reviewsBackdrop');
  if(!state.reviewsFor){ backdrop.classList.remove('open'); return; }
  const isForBlogger = state.reviewsForType === 'blogger';
  const item = isForBlogger ? BLOGGERS.find(b=>b.id===state.reviewsFor) : SHOPS.find(s=>s.id===state.reviewsFor);
  const list = isForBlogger ? DEMO_REVIEWS_FOR_BLOGGER : DEMO_REVIEWS_FOR_SHOP;
  const canReview = isForBlogger ? item.cooperating : item.mirroring;
  const sheet = document.getElementById('reviewsSheet');

  const reviewsListHtml = list.map(r=>{
    const liked = state.likedReviews.has(r.id);
    const authorStatHtml = isForBlogger
      ? `<div class="review-author-stat">${r.authorRating.toFixed(1).replace('.',',')} бала</div>`
      : `<div class="review-author-stat">${formatStars(r.authorStars)}</div>`;
    return `
    <div class="review-row">
      <div class="review-avatar-col">
        <div class="review-avatar">${r.authorIcon}</div>
        ${authorStatHtml}
      </div>
      <div class="review-body">
        <div class="review-top">
          <span class="review-shop">${r.authorName}</span>
          <button class="review-like ${liked?'liked':''}" data-review-like="${r.id}">${liked?'❤':'🤍'} ${r.likes}</button>
        </div>
        <div class="review-text">${r.text}</div>
      </div>
    </div>
  `;}).join('');

  const starsPickerHtml = [1,2,3,4,5].map(n=>
    `<button class="star-pick ${n<=state.draftRating?'on':''}" data-star-pick="${n}" aria-label="${n} зірок">${n<=state.draftRating?'★':'☆'}</button>`
  ).join('');

  const targetLabel = isForBlogger ? 'Магазин може залишити відгук про Блогера лише під час активної співпраці.' : 'Блогер PRO може залишити відгук про Магазин лише під час активної співпраці.';

  const topSectionHtml = canReview ? `
    <div class="review-add-box">
      <div class="review-add-label">Залишити відгук про «${item.name}»</div>
      <div class="star-picker">${starsPickerHtml}</div>
      <textarea id="reviewText" placeholder="Опишіть, як пройшла співпраця…" rows="3">${state.draftText}</textarea>
      <button class="btn primary" id="submitReviewBtn" style="width:100%;margin-top:8px;">Опублікувати відгук</button>
    </div>
  ` : `
    <div class="review-lock-box">
      <div class="review-lock-text">Залишити відгук про «${item.name}» можна лише після співпраці. ${targetLabel}</div>
      ${isForBlogger ? '' : `<button class="btn primary" id="inviteFromReviewsBtn" style="width:100%;margin-top:8px;">Запросити</button>`}
    </div>
  `;

  sheet.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-inner">
      <p class="name" style="margin-bottom:12px;">Відгуки</p>
      ${topSectionHtml}
      <div class="review-list-label">${isForBlogger ? 'Відгуки Магазинів' : 'Відгуки Блогерів PRO'}</div>
      ${reviewsListHtml}
      <button class="modal-close" id="reviewsCloseBtn">✕</button>
    </div>
  `;
  backdrop.classList.add('open');
  document.getElementById('reviewsCloseBtn').addEventListener('click', closeReviews);
  document.querySelectorAll('[data-review-like]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const rid = el.dataset.reviewLike;
      const r = list.find(x=>x.id===rid);
      if(!r) return;
      if(state.likedReviews.has(rid)){ state.likedReviews.delete(rid); r.likes--; }
      else { state.likedReviews.add(rid); r.likes++; }
      renderReviews();
    });
  });
  document.querySelectorAll('[data-star-pick]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.draftRating = parseInt(el.dataset.starPick);
      renderReviews();
    });
  });
  const textEl = document.getElementById('reviewText');
  if(textEl) textEl.addEventListener('input', e=>{ state.draftText = e.target.value; });
  const submitBtn = document.getElementById('submitReviewBtn');
  if(submitBtn) submitBtn.addEventListener('click', ()=>{
    if(!state.draftRating){ alert('Оберіть оцінку (від 1 до 5 зірок).'); return; }
    if(!state.draftText.trim()){ alert('Спершу напишіть текст відгуку.'); return; }
    alert('Відгук опубліковано: '+'★'.repeat(state.draftRating)+'☆'.repeat(5-state.draftRating)+' — «'+state.draftText.trim()+'»');
    state.draftRating = 0; state.draftText = '';
    renderReviews();
  });
  const inviteBtn = document.getElementById('inviteFromReviewsBtn');
  if(inviteBtn) inviteBtn.addEventListener('click', ()=>{
    alert('Запрошення надіслано «'+item.name+'» — щойно погодиться, зможете залишити відгук.');
  });
}
function closeReviews(){ state.reviewsFor = null; document.getElementById('reviewsBackdrop').classList.remove('open'); }

/* ============ INFO POPUP ============ */

    <p>У розгорнутій картці рядок «Магазин: …» відкриває картку цього Магазину на сторінці Магазини.</p>

  shop: `

    <p><b>6 панелей картки:</b> товарів, варіацій, одиниць, дзеркал, % повернень, кількість виплат. Жодних сум у гривнях на картці немає навмисно.</p>
    <p>Плашка «Рейтинг: X,X бала» у правому верхньому куті картки — це «Рейтинг комунікації», який магазини й блогери виставляють одне одному при закритті угоди на сторінці Фінанси → Комісійні.</p>
  `,
  blogger: `
    <p><b>Сортування</b> (Зірок · Балів · Конверсія · Товарів · Магазини · Повернень · Дата реєстрації) — за замовчуванням активне «Зірок» за спаданням. Клік по активній кнопці перемикає напрям, третій клік вимикає сортування.</p>
    <p><b>«Балів»</b> — той самий «Рейтинг комунікації», що й на картках Магазинів: скільки балів (1,0–5,0) заробив цей блогер за ввічливість і чіткість у співпраці.</p>

function openInfo(){
  const backdrop = document.getElementById('infoBackdrop');
  const sheet = document.getElementById('infoSheet');
  const titles = {product:'Як працює сторінка «Вітрина»', shop:'Як працює сторінка «Магазини»', blogger:'Як працює сторінка «Блогери»'};
  sheet.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-inner">
      <p class="name" style="margin-bottom:12px;">${titles[state.type]}</p>
      <div class="info-text">${INFO_TEXT[state.type]}</div>
      <button class="modal-close" id="infoCloseBtn">✕</button>
    </div>
  `;
  backdrop.classList.add('open');
  document.getElementById('infoCloseBtn').addEventListener('click', closeInfo);
}
function closeInfo(){ document.getElementById('infoBackdrop').classList.remove('open'); }
document.getElementById('infoBackdrop').addEventListener('click', e=>{ if(e.target.id==='infoBackdrop') closeInfo(); });
document.getElementById('infoBtn').addEventListener('click', openInfo);
document.getElementById('reviewsBackdrop').addEventListener('click', e=>{ if(e.target.id==='reviewsBackdrop') closeReviews(); });
document.getElementById('modalBackdrop').addEventListener('click', e=>{ if(e.target.id==='modalBackdrop') closeModal(); });

/* ============ SWITCHES ============ */
const NOTES = {
  product: 'Вітрина: рішення приймаєте ви (Блогер) — дзеркалити товар чи ні. «Комісія» бачить лише Блогер PRO.',
  shop: 'Магазини: рішення приймаєте ви (Блогер) — чи дзеркалити весь магазин. Платіжна система/Ручна оплата підказує, чи будуть зірочки.',
  blogger: 'Блогери: рішення приймає Магазин — кого запросити. Тут завжди лише Блогери PRO.'
};
function setNote(){ document.getElementById('pageNote').textContent = NOTES[state.type]; }

document.querySelectorAll('#typeSwitch button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#typeSwitch button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.type = btn.dataset.type;
    state.sortId = state.type==='blogger' ? 'stars' : null; state.sortDir='desc'; state.search=''; state.filterOpen=false;
    state.filterOnlyStock=false; state.filterOnlyEq=false; state.filterOnlyShop=false;
    state.platformFilter=new Set(); state.formatFilter=new Set(); state.categoryFilter=new Set(); state.sampleFilter=new Set();
    state.convMin=''; state.convMax=''; state.onSiteOnly=false; state.regionFilter='';
    state.coopFilter='all'; state.favOnlyBlogger=false;
    state.productPeriod='all'; state.mirrorFilter='all'; state.favOnlyProduct=false;
    state.productCategoryFilter=new Set(); state.priceMin=''; state.priceMax='';
    state.viewsMin=''; state.viewsMax=''; state.productReturnsMin=''; state.productReturnsMax='';
    renderAll();
  });
});
document.querySelectorAll('#densitySwitch button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#densitySwitch button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.density = btn.dataset.density;
    renderList();
  });
});

function renderAll(){
  renderToolbar();
  renderList();
  setNote();
}
renderAll();
</script>
