<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Магазини — BEROO Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#15202B; --muted:#5E6B78; --line:#D9DFE6;
  --accent:#3446D9; --accent-ink:#FFFFFF; --accent-soft:#E4E8FD;
  --danger:#C23328; --warn:#9A5A00; --ok:#1C8456;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F151B; --surface:#18212A; --surface-2:#1F2A35; --ink:#E8EDF2; --muted:#93A1AF; --line:#2A3642;
    --accent:#8190FF; --accent-ink:#0F151B; --accent-soft:#232C57;
    --danger:#FF7B6E; --warn:#F0B35A; --ok:#5CD39A;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font:16px/1.45 var(--font);
  -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased;
  padding-top:var(--sat);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto}
svg{display:block}

/* ---------- Шапка ---------- */
.top{padding:18px 16px 6px;display:flex;align-items:flex-end;gap:12px}
.top h1{margin:0;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.025em}
.top h1 small{font-size:17px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.sync{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok .dot{background:var(--ok)}
.sync.busy .dot{background:var(--accent);animation:pulse 1s infinite}
.sync.err{color:var(--danger)} .sync.err .dot{background:var(--danger)}
.sync.demo .dot{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}

/* ---------- Панель керування ---------- */
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px}
.search-row{display:flex;gap:8px}
.search{flex:1;position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{
  width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
  padding:0 14px 0 40px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sq{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.sq.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chips + .chips{padding-top:6px}
.chip{
  flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap
}
.chip i{font-style:normal;color:var(--muted);font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] i{color:inherit;opacity:.7}
.chip.soft{height:32px;font-size:13px}

/* ---------- Список і картки ---------- */
.list{padding:6px 16px calc(120px + var(--sab));display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.card-head{width:100%;display:grid;grid-template-columns:52px 1fr 20px;gap:12px;align-items:center;padding:12px 14px;text-align:left}
.logo{width:52px;height:52px;border-radius:14px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--muted);border:1px solid var(--line)}
.logo img{width:100%;height:100%;object-fit:cover}
.c-name{font-weight:600;font-size:17px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-sub{font-family:var(--mono);font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:500;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.tag.mono{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag.wfp{border-color:var(--accent);color:var(--accent)}
.chev{color:var(--muted);transition:transform .2s}
.card.open .chev{transform:rotate(180deg)}
.card-body{display:none;border-top:1px solid var(--line)}
.card.open .card-body{display:block}
.row{display:flex;align-items:center;gap:6px;padding:10px 8px 10px 14px;border-bottom:1px solid var(--line)}
.row-main{flex:1;min-width:0}
.row-label{font-size:12px;color:var(--muted)}
.row-val{font-size:15px;overflow-wrap:anywhere}
.row-val.m{font-family:var(--mono);font-size:14px}
.row-val.empty{color:var(--muted)}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.ib:active{background:var(--surface-2)}
.ib.acc{color:var(--accent)}
.card-actions{display:flex;gap:8px;padding:12px 14px 14px}
.btn{height:48px;border-radius:14px;font-weight:600;font-size:16px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{border:1px solid var(--line);background:var(--surface-2);flex:1}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:1}
.btn.danger{border:1px solid var(--danger);color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn:disabled{opacity:.55}

.empty-state{padding:48px 24px;text-align:center;color:var(--muted)}
.empty-state p{margin:0 0 16px}
.empty-state .btn{display:inline-flex}

/* ---------- Кнопка «Додати» ---------- */
.fab{
  position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + var(--sab));z-index:6;
  height:58px;padding:0 22px 0 18px;border-radius:29px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;box-shadow:0 8px 24px rgba(52,70,217,.35)
}

/* ---------- Форма (повноекранний аркуш) ---------- */
.sheet{
  position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden
}
.sheet.open{transform:none;visibility:visible}
.sheet-top{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--sat)) 8px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.sheet-top h2{flex:1;margin:0;font-size:18px;font-weight:600;text-align:center}
.sheet-top .ib{width:44px;height:44px}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px}
.sheet-body > *{max-width:528px;margin-left:auto;margin-right:auto}
.sheet-foot{display:flex;gap:10px;padding:10px 16px calc(10px + var(--sab));border-top:1px solid var(--line);background:var(--bg)}
.sheet-foot > div{display:flex;gap:10px;width:100%;max-width:528px;margin:0 auto}

.group{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.group h3{margin:0 0 10px;font-size:15px;font-weight:600}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label,.field .lbl{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
.inp{position:relative;display:flex}
.inp input{
  width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);
  padding:0 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none
}
.inp input.m{font-family:var(--mono);font-size:15px}
.inp input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.inp.has-btn input{padding-right:52px}
.inp .in-btn{position:absolute;right:4px;top:4px;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:0}
.hint.err{color:var(--danger)} .hint.warn{color:var(--warn)} .hint.ok{color:var(--ok)}
.link-btn{font-size:13px;font-weight:600;color:var(--accent);padding:4px 0}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline}

.logo-row{display:flex;gap:14px;align-items:center}
.logo-pick{width:88px;height:88px;border-radius:22px;border:1.5px dashed var(--line);background:var(--surface-2);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--muted)}
.logo-pick.has{border-style:solid}
.logo-pick img{width:100%;height:100%;object-fit:cover}
.logo-side{display:flex;flex-direction:column;gap:4px;align-items:flex-start}

/* Живі посилання — головна «фішка» форми */
.links{margin-top:10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);padding:4px 12px}
.links div{font-family:var(--mono);font-size:14px;padding:7px 0;overflow-wrap:anywhere;color:var(--muted)}
.links div + div{border-top:1px solid var(--line)}
.links b{color:var(--accent);font-weight:500}
.links .ph{color:var(--muted);opacity:.6}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.form-err{background:var(--danger);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px;display:none}
.form-err.show{display:block}

/* ---------- Сповіщення ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(92px + var(--sab));z-index:30;transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;
  transition:.2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet.open ~ .toast{bottom:calc(84px + var(--sab))}

/* ---------- Вхід ---------- */
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 20px calc(24px + var(--sab))}
.login[hidden]{display:none}
.login-box{width:100%;max-width:400px}
.login-box h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.025em}
.login-sub{margin:6px 0 24px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;margin:4px 0 16px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.login-box .btn{width:100%}
.user-btn{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px;display:grid;place-items:center;flex:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div style="flex:1;min-width:0">
      <h1>Магазини<small id="count"></small></h1>
      <div class="sync" id="sync"><span class="dot"></span><span id="syncText">Завантажую…</span></div>
    </div>
    <button class="user-btn" id="userBtn" aria-label="Вийти"></button>
  </header>

  <div class="tools">
    <div class="search-row">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Назва, код, пошта, ЄДРПОУ" autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
      <button class="sq" id="refresh" aria-label="Оновити з таблиці">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
    <div class="chips" id="acqChips" role="group" aria-label="Еквайринг"></div>
    <div class="chips" id="catChips" role="group" aria-label="Категорія"></div>
  </div>

  <main class="list" id="list"></main>
</div>

<button class="fab" id="addBtn" aria-label="Новий магазин">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Новий
</button>

<!-- Форма магазину -->
<section class="sheet" id="sheet" aria-hidden="true" aria-labelledby="sheetTitle">
  <header class="sheet-top">
    <button class="ib" id="closeBtn" aria-label="Закрити">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <h2 id="sheetTitle">Новий магазин</h2>
    <span style="width:44px"></span>
  </header>

  <form class="sheet-body" id="form" novalidate autocomplete="off">
    <div class="form-err" id="formErr"></div>

    <div class="group">
      <div class="logo-row">
        <button type="button" class="logo-pick" id="logoPick" aria-label="Обрати логотип">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
        <div class="logo-side">
          <strong style="font-weight:600">Логотип</strong>
          <button type="button" class="link-btn" id="logoChoose">Обрати фото</button>
          <button type="button" class="link-btn" id="logoRemove" style="color:var(--danger);display:none">Прибрати</button>
        </div>
        <input type="file" id="logoInput" accept="image/*" hidden>
      </div>
    </div>

    <div class="group">
      <div class="field">
        <label for="f-name">Назва магазину</label>
        <div class="inp"><input id="f-name" autocapitalize="sentences" enterkeyhint="next"></div>
      </div>
      <div class="field">
        <label for="f-code">Код магазину</label>
        <div class="inp"><input id="f-code" class="m" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="url" maxlength="40" placeholder="lyon-shop" enterkeyhint="next"></div>
        <div class="hint" id="h-code">Латиниця, цифри, дефіс. Підставляється з назви автоматично.</div>
        <div class="links" id="linksPreview"></div>
      </div>
    </div>

    <div class="group">
      <h3>Доступ до кабінету</h3>
      <div class="field">
        <label for="f-email">Пошта</label>
        <div class="inp"><input id="f-email" type="email" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next"></div>
        <div class="hint" id="h-email"></div>
      </div>
      <div class="field">
        <div class="lbl-row"><label for="f-password">Пароль</label><button type="button" class="link-btn" id="genPass">Згенерувати</button></div>
        <div class="inp has-btn">
          <input id="f-password" type="password" class="m" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="new-password">
          <button type="button" class="in-btn" id="togglePass" aria-label="Показати пароль"></button>
        </div>
      </div>
    </div>

    <div class="group">
      <h3>Реквізити</h3>
      <div class="field">
        <label for="f-fop">ФОП</label>
        <div class="inp"><input id="f-fop" autocapitalize="words" placeholder="ФОП Прізвище Імʼя По батькові"></div>
      </div>
      <div class="field">
        <label for="f-edrpou">ЄДРПОУ / РНОКПП</label>
        <div class="inp"><input id="f-edrpou" class="m" inputmode="numeric" maxlength="10"></div>
        <div class="hint" id="h-edrpou"></div>
      </div>
      <div class="field">
        <label for="f-iban">IBAN</label>
        <div class="inp"><input id="f-iban" class="m" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="36" placeholder="UA00 0000 0000 0000 0000 0000 000"></div>
        <div class="hint" id="h-iban"></div>
      </div>
    </div>

    <div class="group">
      <h3>Оплата</h3>
      <div class="field">
        <span class="lbl">Еквайринг</span>
        <div class="seg" id="acqSeg">
          <button type="button" data-v="Monobank" aria-pressed="false">Monobank</button>
          <button type="button" data-v="WayForPay" aria-pressed="false">WayForPay</button>
        </div>
      </div>
      <div class="field">
        <label for="f-prro">Номер каси ПРРО</label>
        <div class="inp"><input id="f-prro" class="m" inputmode="numeric"></div>
      </div>
    </div>

    <div class="group">
      <div class="field">
        <label for="f-category">Категорія</label>
        <div class="inp"><input id="f-category" list="catList" autocapitalize="sentences"></div>
        <datalist id="catList"></datalist>
      </div>
    </div>
  </form>

  <footer class="sheet-foot">
    <div>
      <button type="button" class="btn danger" id="delBtn">Видалити</button>
      <button type="button" class="btn primary" id="saveBtn">Зберегти</button>
    </div>
  </footer>
</section>

<!-- Вхід -->
<section class="login" id="login" hidden>
  <form class="login-box" id="loginForm" novalidate>
    <h1>Магазини</h1>
    <p class="login-sub">Доступи мережі BEROO Online</p>
    <input type="text" name="username" autocomplete="username" value="beroo-shops" hidden>
    <div class="field">
      <label for="l-pass">Пароль</label>
      <div class="inp has-btn">
        <input id="l-pass" type="password" class="m" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
        <button type="button" class="in-btn" id="l-toggle" aria-label="Показати пароль"></button>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="l-remember" checked> Запамʼятати на цьому телефоні</label>
    <div class="form-err" id="loginErr"></div>
    <button class="btn primary" id="loginBtn" type="submit">Увійти</button>
  </form>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== Базове ===================== */
const $ = s => document.querySelector(s);
// Адреса веб-застосунку Apps Script (не секрет — без пароля вона нічого не віддає).
const API_URL = 'https://script.google.com/macros/s/AKfycbw08AlN8ev2SCNzpPYfPBu_Tnrj84jzSvqvzlZ8BxD-0OtnioNNdrUjWyPriFKqxduzKg/exec';
const CACHE_KEY = 'beroo_stores_v1';
const AUTH_KEY = 'beroo_shops_auth';

const ICON = {
  copy: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  open: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/></svg>',
  eye: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',

/* Сесія: пароль зберігається в localStorage (якщо «Запамʼятати») або до закриття вкладки */
function readAuth(){
  try { return JSON.parse(localStorage.getItem(AUTH_KEY) || sessionStorage.getItem(AUTH_KEY) || 'null'); }
  catch (e) { return null; }
}
let auth = readAuth();

// text/plain — щоб браузер не робив CORS-preflight, який Apps Script не підтримує
async function request(pass, action, args){
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({pass, action, args}),
      redirect: 'follow'
    });
  } catch (e) {
    throw new Error(navigator.onLine
      ? 'Apps Script не відповів. Перевірте, що розгорнуто нову версію з доступом «Усі».'
      : 'Немає інтернету.');
  }
  let out;
  try { out = await res.json(); }
  catch (e) { throw new Error('Apps Script відповів не тим форматом. Розгорніть нову версію Code.gs.'); }
  if (!out.ok) { const err = new Error(out.error || 'Помилка на сервері'); err.auth = !!out.auth; throw err; }
  return out;
}

async function call(action, ...args){
  if (!auth) { showLogin(); throw new Error('Потрібен вхід.'); }
  try { return (await request(auth.pass, action, args)).data; }
  catch (e) { if (e.auth) logout(errMsg(e)); throw e; }
}

async function copyText(text, label){
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  toast((label ? label + ': ' : '') + 'скопійовано');
}

/* ===================== Перевірки ===================== */
const TR = {'а':'a','б':'b','в':'v','г':'h','ґ':'g','д':'d','е':'e','є':'ie','ж':'zh','з':'z','и':'y','і':'i','ї':'i','й':'i','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ь':'','ю':'iu','я':'ia','ы':'y','э':'e','ё':'io','ъ':'',"'":'','ʼ':'','’':''};
function toCode(name){
  return String(name).toLowerCase().split('').map(ch => TR[ch] !== undefined ? TR[ch] : ch).join('')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40).replace(/-+$/, '');
}
const CODE_RE = /^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/;

function ibanState(v){
  const s = String(v || '').replace(/\s/g, '').toUpperCase();
  if (!s) return '';
  if (!/^UA\d{27}$/.test(s)) return 'len';
  const num = (s.slice(4) + s.slice(0, 4)).replace(/[A-Z]/g, c => c.charCodeAt(0) - 55);
  let m = 0;
  for (const d of num) m = (m * 10 + Number(d)) % 97;
  return m === 1 ? 'ok' : 'sum';
}

/* ===================== Список ===================== */
function initials(name){
  const w = String(name || '?').trim().split(/\s+/);
  return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
}

function filtered(){
  const q = query.trim().toLowerCase();
  return stores.filter(s => {

    if (fAcq !== 'all' && fAcq !== 'none' && s.acquiring !== fAcq) return false;
    if (fCat && s.category !== fCat) return false;
    if (!q) return true;
    return [s.name, s.code, s.email, s.edrpou, s.fop, s.category, s.iban].join(' ').toLowerCase().includes(q);
  }).sort((a, b) => a.name.localeCompare(b.name, 'uk'));
}

// Обрізає до квадрата й стискає, щоб логотип вмістився в одну клітинку таблиці
function squareImage(file, size){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      let q = 0.85, out = c.toDataURL('image/jpeg', q);
      while (out.length > 45000 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

function codeProblem(code){
  if (!code) return 'Вкажіть код магазину';
  if (code.length < 2) return 'Мінімум 2 символи';
  if (!CODE_RE.test(code)) return 'Код не може починатися чи закінчуватися дефісом';
  const dup = stores.find(s => s.code === code && (!editing || s.id !== editing.id));
  if (dup) return 'Цей код уже має «' + dup.name + '»';
  return '';
}

function updateCode(){
  const code = F('code').value;

  $('#linksPreview').innerHTML = `<div>https://${c}.beroo.online</div><div>https://beroo.online/s/${c}</div>`;
  const h = $('#h-code');
  const p = code ? codeProblem(code) : '';
  if (p) { h.className = 'hint err'; h.textContent = p; }
  else if (editing && code !== editing.code) { h.className = 'hint warn'; h.textContent = 'Після збереження старі посилання перестануть вести на цей магазин.'; }

function checkIban(){
  const el = F('iban');

  const f = fmtIban(raw);

  const st = ibanState(raw);

  else if (st === 'sum') setHint('iban', 'warn', 'Контрольна сума не сходиться. Перевірте цифри.');
  else setHint('iban', 'warn', 'Має бути UA і 27 цифр, зараз ' + raw.length + ' символів');
}

    fop: F('fop').value.trim(),
    edrpou: F('edrpou').value.trim(),
    iban: F('iban').value.replace(/\s/g, '').toUpperCase(),
    acquiring: acq,
    prro: F('prro').value.trim(),
    category: F('category').value.trim(),
    logo: logoData
  };
  const problem = !data.name ? 'Вкажіть назву магазину' : codeProblem(data.code);
  if (problem) {
    err.textContent = problem; err.classList.add('show');
    $('#form').scrollTop = 0;
    (!data.name ? F('name') : F('code')).focus();
    return;
  }
  err.classList.remove('show');

  const btn = $('#saveBtn');
  btn.disabled = true; btn.textContent = 'Зберігаю…';
  setSync('busy', 'Записую в таблицю…');
  try {
    const saved = await call('saveStore', data);
    const i = stores.findIndex(s => s.id === saved.id);
    if (i > -1) stores[i] = saved; else stores.push(saved);
    saveCache();
    openId = saved.id;
    closeForm(); render();
    setSync('ok', 'Синхронізовано о ' + hhmm());
    toast(editing ? 'Зміни збережено' : 'Магазин додано');
    setTimeout(() => { const c = document.querySelector(`.card[data-id="${CSS.escape(saved.id)}"]`); c && c.scrollIntoView({block:'center', behavior:'smooth'}); }, 50);
  } catch (e) {
    err.textContent = 'Не збережено: ' + errMsg(e); err.classList.add('show');
    $('#form').scrollTop = 0;
    setSync('err', 'Остання дія не збереглась');
  }
  btn.disabled = false; btn.textContent = 'Зберегти';
});

/* Видалення — друге натискання підтверджує */
function disarmDelete(){ clearTimeout(delArmed); delArmed = null; const b = $('#delBtn'); b.classList.remove('armed'); b.textContent = 'Видалити'; }
$('#delBtn').addEventListener('click', async () => {
  const b = $('#delBtn');
  if (!delArmed) {
    b.classList.add('armed'); b.textContent = 'Точно видалити?';
    delArmed = setTimeout(disarmDelete, 3500);
    return;
  }
  disarmDelete();
  b.disabled = true; b.textContent = 'Видаляю…';
  try {
    await call('deleteStore', editing.id);
    stores = stores.filter(s => s.id !== editing.id);
    saveCache(); closeForm(); render();
    toast('Магазин видалено з таблиці');
    setSync('ok', 'Синхронізовано о ' + hhmm());
  } catch (e) {
    const err = $('#formErr'); err.textContent = 'Не видалено: ' + errMsg(e); err.classList.add('show');
  }
  b.disabled = false; b.textContent = 'Видалити';
});

/* ===================== Вхід і вихід ===================== */
function showLogin(msg){
  $('#login').hidden = false;
  const er = $('#loginErr'); er.textContent = msg || ''; er.classList.toggle('show', !!msg);
  $('#l-pass').value = '';
  $('#l-pass').type = 'password';
  $('#l-toggle').innerHTML = ICON.eye;
  setTimeout(() => $('#l-pass').focus(), 100);
}

function logout(msg){
  try { localStorage.removeItem(AUTH_KEY); sessionStorage.removeItem(AUTH_KEY); localStorage.removeItem(CACHE_KEY); } catch (e) {}
  auth = null; stores = []; openId = null;
  closeForm();
  render();
  showLogin(msg);
}

function renderUser(){ $('#userBtn').textContent = auth ? (auth.user || '?').trim()[0].toUpperCase() : ''; }

$('#l-toggle').addEventListener('click', () => {
  const el = $('#l-pass');
  el.type = el.type === 'password' ? 'text' : 'password';
  $('#l-toggle').innerHTML = el.type === 'password' ? ICON.eye : ICON.eyeOff;
});

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pass = $('#l-pass').value;
  const er = $('#loginErr');
  if (!pass) { er.textContent = 'Введіть пароль.'; er.classList.add('show'); return; }
  const btn = $('#loginBtn');
  btn.disabled = true; btn.textContent = 'Перевіряю…';
  try {
    const out = await request(pass, 'login', []);
    auth = {pass, user: out.user};
    const store = $('#l-remember').checked ? localStorage : sessionStorage;
    try { store.setItem(AUTH_KEY, JSON.stringify(auth)); } catch (e) {}
    $('#login').hidden = true;
    er.classList.remove('show');
    renderUser();
    toast('Вітаю, ' + out.user);
    load(false);
  } catch (err) {
    er.textContent = errMsg(err); er.classList.add('show');
  }
  btn.disabled = false; btn.textContent = 'Увійти';
});

let logoutArmed = null;
$('#userBtn').addEventListener('click', () => {
  if (!logoutArmed) {
    toast((auth ? auth.user + '. ' : '') + 'Натисніть ще раз, щоб вийти');
    logoutArmed = setTimeout(() => { logoutArmed = null; }, 2500);
    return;
  }
  clearTimeout(logoutArmed); logoutArmed = null;
  logout();
});

/* ===================== Старт ===================== */
renderUser();
if (auth) {
  stores = readCache();
  if (stores.length) { render(); setSync('busy', 'Показую збережене, оновлюю…'); }
  load(false);
} else {
  setSync('err', 'Потрібен вхід');
  render();
  showLogin();
}
</script>
</body>
</html>
