<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEROO — Каталог (налаштування дерева категорій)</title>
<style>
:root{
  --red:#FF2D55;--red-hover:#E6244A;--red-soft:#FFE8ED;--red-50:#FFF5F7;
  --ink-900:#1A1A1A;--ink-700:#333;--ink-500:#737373;--ink-400:#999;--ink-300:#B3B3B3;
  --line:#EAEAEA;--line-soft:#F2F2F2;--bg:#F7F7F8;--card:#fff;
  --green:#22A06B;--green-soft:#E3F6EC;
  --gold:#F5B300;--gold-soft:#FFF3D1;--gold-dark:#8A6500;
  --gray-star:#C7C7CC;
  --radius:14px;--radius-sm:10px;--radius-lg:20px;
  --shadow:0 1px 3px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.04);
  --shadow-red:0 4px 16px rgba(255,45,85,.28);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--ink-900);-webkit-font-smoothing:antialiased;
  min-height:100vh;font-size:14px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
input,select,textarea{font-family:inherit;font-size:inherit;}
a{color:inherit;text-decoration:none;}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;}
.burger{width:26px;height:26px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:2px;flex-shrink:0;}
.burger span{height:2.5px;background:var(--ink-900);border-radius:2px;display:block;}
@media(min-width:900px){ .burger{display:none;} }
.topbar-logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;flex-shrink:0;}
.tb-logo-mark{width:28px;height:28px;border-radius:8px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}

/* APP SHELL */
.app{display:flex;flex-direction:column;min-height:100vh;}
@media(min-width:900px){ .app{flex-direction:row;} }
.sidebar{display:none;}
@media(min-width:900px){
  .sidebar{width:264px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;}
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:8px 10px 18px;}
.sb-logo{width:34px;height:34px;border-radius:9px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;}
.sb-name{font-weight:700;font-size:16px;letter-spacing:.2px;}
.sb-store{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:12px;color:var(--ink-700);}
.sb-store .ic{color:var(--red);font-size:14px;}
.sb-group{margin-bottom:2px;}
.sb-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--ink-700);cursor:pointer;transition:background .15s,color .15s;width:100%;text-align:left;}
.sb-item:hover{background:var(--bg);}
.sb-item.active{background:var(--red-soft);color:var(--red);font-weight:600;}
.sb-item .ic{width:18px;display:flex;justify-content:center;font-size:15px;flex-shrink:0;}
.sb-item .chev{margin-left:auto;font-size:10px;color:var(--ink-400);transition:transform .2s;display:inline-block;}
.sb-item.open .chev{transform:rotate(180deg);}
.sb-sub{max-height:0;overflow:hidden;transition:max-height .3s ease;padding-left:6px;}
.sb-sub.open{max-height:300px;}
.sb-subitem{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 42px;border-radius:9px;font-size:13px;color:var(--ink-500);cursor:pointer;transition:background .15s,color .15s;width:100%;text-align:left;position:relative;}
.sb-subitem:hover{background:var(--bg);color:var(--ink-900);}
.sb-subitem.active{color:var(--red);font-weight:600;background:var(--red-50);}
.sb-subitem.active::before{content:"";position:absolute;left:26px;top:50%;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:var(--red);}
.sb-footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft);}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.sb-user-info .n{font-size:13px;font-weight:600;}
.sb-user-info .r{font-size:11px;color:var(--ink-400);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.content{padding:16px 14px 60px;max-width:1000px;width:100%;}
@media(min-width:900px){ .content{padding:24px 32px 60px;} }

.page-head{margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.page-head h1{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em;}
.page-head p{font-size:13.5px;color:var(--ink-500);line-height:1.5;}
@media(min-width:900px){ .page-head h1{font-size:26px;} }

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:11px;font-size:13.5px;font-weight:600;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--red);color:#fff;box-shadow:var(--shadow-red);}
.btn-primary:hover{background:var(--red-hover);}
.btn-ghost{background:#fff;color:var(--ink-700);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink-300);}
.btn-soft{background:var(--red-soft);color:var(--red);}
.btn-soft:hover{background:#FFD9E1;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;line-height:1.5;}
.badge-green{background:var(--green-soft);color:var(--green);}
.badge-red{background:var(--red-soft);color:var(--red);}
.badge-gray{background:var(--line-soft);color:var(--ink-500);}
.badge-dark{background:var(--ink-900);color:#fff;}

/* BANNER */
.category-banner{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--red),var(--red-hover));color:#fff;border-radius:16px;padding:16px 20px;margin-bottom:20px;box-shadow:var(--shadow-red);flex-wrap:wrap;}
.cb-icon{font-size:30px;flex-shrink:0;}
.cb-text{flex:1;min-width:200px;}
.cb-title{font-size:14.5px;font-weight:800;margin-bottom:3px;}
.cb-sub{font-size:12px;opacity:.92;line-height:1.4;}
.category-banner .btn-primary{background:#fff;color:var(--red);box-shadow:none;flex-shrink:0;}
.category-banner .btn-primary:hover{background:#FFEFF2;}

/* PRODUCT ROW */
.product-row{display:flex;gap:12px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:14px;align-items:center;transition:box-shadow .2s,border-color .15s;}
.product-row:hover{box-shadow:0 6px 20px rgba(0,0,0,.07);border-color:#DEDEDE;}
.pr-photo{width:64px;height:64px;flex-shrink:0;border-radius:12px;background:linear-gradient(135deg,#F4F4F6,#EAEAEE);display:flex;align-items:center;justify-content:center;font-size:30px;}
.pr-info{flex:1;min-width:0;}
.pr-title{font-size:14.5px;font-weight:700;margin-bottom:4px;}
.pr-cat-path{font-size:11.5px;color:var(--ink-500);display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:6px;}
.pr-cat-path .seg{background:var(--bg);padding:2px 8px;border-radius:99px;font-weight:600;color:var(--ink-700);}
.pr-cat-path .arrow{color:var(--ink-300);}
.pr-meta{display:flex;gap:14px;font-size:12.5px;color:var(--ink-500);flex-wrap:wrap;}
.pr-meta b{color:var(--ink-900);font-weight:700;}
.pr-actions{display:flex;gap:8px;flex-shrink:0;}

/* CATEGORY TREE (сторінка) */
.cat-tree{display:flex;flex-direction:column;gap:6px;}
.cat-node{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;}
.cat-node-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background .15s;}
.cat-node-head:hover{background:var(--bg);}
.cat-node-head .chev{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink-400);font-size:11px;transition:transform .2s;border-radius:6px;}
.cat-node-head .chev.open{transform:rotate(90deg);}
.cat-node-icon{width:34px;height:34px;border-radius:9px;background:var(--red-soft);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.cat-node-icon.sub{width:28px;height:28px;background:var(--bg);font-size:14px;}
.cat-node-name{font-size:13.5px;font-weight:700;flex:1;min-width:0;}
.cat-node-name.sub{font-weight:600;font-size:13px;}
.cat-node-count{font-size:11.5px;color:var(--ink-500);font-weight:600;background:var(--bg);padding:2px 9px;border-radius:99px;flex-shrink:0;}
.cat-node-count.has-items{background:var(--green-soft);color:var(--green);}
.cat-children{max-height:0;overflow:hidden;transition:max-height .3s ease;background:var(--bg);}
.cat-children.open{max-height:2000px;}
.cat-children-inner{padding:6px 10px 10px 44px;display:flex;flex-direction:column;gap:4px;}
.cat-leaf-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;background:#fff;border:1px solid var(--line-soft);cursor:pointer;transition:background .15s,border-color .15s;}
.cat-leaf-row:hover{background:var(--red-50);border-color:var(--red-soft);}

/* MODAL TREE (налаштування, чекбокси) */
.tree-box{border:1px solid var(--line);border-radius:12px;max-height:440px;overflow-y:auto;padding:8px;background:var(--bg);}
.tree-row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;}
.tree-row:hover{background:#fff;}
.tree-expand-btn{width:20px;height:20px;border-radius:6px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink-700);line-height:1;}
.tree-expand-btn.invisible{visibility:hidden;border:none;background:transparent;}
.tree-check-label{display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;min-width:0;}
.tree-checkbox-visual{width:18px;height:18px;border-radius:5px;border:2px solid var(--ink-300);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:#fff;}
.tree-checkbox-visual.checked{background:var(--red);border-color:var(--red);}
.tree-checkbox-visual.checked::after{content:"✓";color:#fff;font-size:12px;font-weight:800;line-height:1;}
.tree-checkbox-visual.indeterminate{background:var(--red-soft);border-color:var(--red-soft);}
.tree-checkbox-visual.indeterminate::after{content:"";width:8px;height:8px;background:var(--red);border-radius:2px;}
.tree-node-name{font-size:13px;}
.tree-node-name.lvl1{font-weight:800;font-size:13.5px;}
.tree-node-name.lvl2{font-weight:600;}
.tree-node-name.lvl3{font-weight:500;color:var(--ink-700);}
.tree-children{display:none;}
.tree-children.open{display:block;}

/* CATEGORY PICKER (форма товару) */
.picker-box{border:1px solid var(--line);border-radius:12px;max-height:280px;overflow-y:auto;padding:6px;background:var(--bg);}
.picker-node-head{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
.picker-node-head:hover{background:#fff;}
.picker-node-head .chev{width:16px;font-size:10px;color:var(--ink-400);transition:transform .2s;flex-shrink:0;}
.picker-node-head .chev.open{transform:rotate(90deg);}
.picker-leaf{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 30px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--ink-700);}
.picker-leaf:hover{background:#fff;}
.picker-leaf.selected{background:var(--red);color:#fff;font-weight:700;}
.picker-leaf .radio{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-300);flex-shrink:0;}
.picker-leaf.selected .radio{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 3px var(--red);}
.picker-children{padding-left:14px;}
.picker-selected-line{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--red-soft);border-radius:10px;font-size:12.5px;color:var(--red);font-weight:700;margin-top:8px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;padding:16px;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;}
.modal-overlay.active{display:flex;}
.modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:520px;margin:20px 0;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:modalIn .2s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-head{padding:18px 20px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;gap:12px;}
.modal-head h3{font-size:17px;font-weight:700;}
.modal-head p{font-size:12.5px;color:var(--ink-500);margin-top:3px;}
.modal-close{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink-500);flex-shrink:0;font-size:14px;}
.modal-body{padding:20px 22px;}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end;}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-700);}
.field input,.field select{padding:11px 13px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;background:#fff;width:100%;}
.field input:focus{outline:none;border-color:var(--red);}

/* REGISTRATION */
.reg-screen{position:fixed;inset:0;background:#fff;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.reg-screen.hidden{display:none;}
.reg-box{width:100%;max-width:440px;}
.reg-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;}
.reg-logo-mark{width:44px;height:44px;border-radius:12px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;}
.reg-logo-name{font-size:22px;font-weight:800;letter-spacing:.5px;}
.reg-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:6px;}
.reg-sub{font-size:13.5px;color:var(--ink-500);text-align:center;margin-bottom:28px;line-height:1.5;}
.role-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
.role-card{padding:20px 14px;border-radius:14px;border:2px solid var(--line);text-align:center;transition:all .15s;cursor:pointer;background:#fff;position:relative;}
.role-card:hover{border-color:var(--ink-300);}
.role-card.locked{cursor:not-allowed;opacity:.6;}
.role-card.locked:hover{border-color:var(--line);}
.role-card .rc-ic{font-size:30px;margin-bottom:10px;}
.role-card .rc-name{font-size:14px;font-weight:700;}
.role-card .rc-desc{font-size:11.5px;color:var(--ink-500);margin-top:4px;line-height:1.4;}
.lock-pill{position:absolute;top:10px;right:10px;background:var(--ink-900);color:#fff;font-size:9px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.03em;display:flex;align-items:center;gap:4px;}

.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{background:var(--ink-900);color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:toastIn .2s ease;max-width:90vw;text-align:center;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.row{display:flex;align-items:center;gap:10px;}
.mb-12{margin-bottom:12px;}
.hidden{display:none !important;}
.empty{text-align:center;padding:60px 20px;color:var(--ink-400);}
.empty .em-ic{font-size:44px;margin-bottom:12px;opacity:.4;}
.empty .em-t{font-size:14px;font-weight:600;color:var(--ink-500);}

.mobile-menu{position:fixed;inset:0;background:#fff;z-index:250;display:none;flex-direction:column;overflow-y:auto;}
.mobile-menu.active{display:flex;}
.mm-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
.mm-body{padding:12px;flex:1;}
.mm-close{width:30px;height:30px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-500);margin-left:auto;}
</style>
</head>
<body>

<!-- ==================== ROLE SCREEN ==================== -->
<div class="reg-screen" id="regScreen">
  <div class="reg-box">
    <div class="reg-logo"><div class="reg-logo-mark">B</div><div class="reg-logo-name">BEROO</div></div>
    <div class="reg-title">Хто ви?</div>
    <div class="reg-sub">Оберіть тип акаунта, щоб продовжити в демо-кабінет.</div>
    <div class="role-choice">
      <div class="role-card locked" onclick="pickBlogger()">
        <span class="lock-pill">🔒 Скоро</span>
        <div class="rc-ic">🎥</div>
        <div class="rc-name">Блогер</div>
        <div class="rc-desc">Цей режим ще недоступний у демо</div>
      </div>
      <div class="role-card" id="roleSeller" onclick="pickSeller()">
        <div class="rc-ic">🏬</div>
        <div class="rc-name">Магазин</div>
        <div class="rc-desc">Каталог, товари, категорії</div>
      </div>
    </div>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="sb-brand"><div class="sb-logo">B</div><div class="sb-name">BEROO</div></div>
    <div class="sb-store"><span class="ic">🏬</span><span>МАГАЗИН ДАЧНИК</span></div>
    <div id="sidebarNav"></div>
    <div class="sb-footer">
      <div class="sb-user">
        <div class="sb-avatar">МС</div>
        <div class="sb-user-info">
          <div class="n">Магазин ДАЧНИК</div>
          <div class="r">Продавець</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="burger" onclick="toggleMobileMenu()"><span></span><span></span><span></span></button>
      <div class="topbar-logo"><div class="tb-logo-mark">B</div>BEROO</div>
    </div>
    <div class="content" id="mainContent"></div>
  </div>
</div>

<div class="mobile-menu" id="mobileMenu">
  <div class="mm-head">
    <div class="sb-logo">B</div><div class="sb-name">BEROO</div>
    <button class="mm-close" onclick="toggleMobileMenu()">✕</button>
  </div>
  <div class="mm-body"><div id="mobileNav"></div></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div class="modal-overlay" id="modal"><div class="modal" id="modalContent"></div></div>

<script>
/* ============================================================
   ДАНІ: 3 материнські x 10 підкатегорій x 3 нижнього рангу
   ============================================================ */
const CATEGORY_TREE_RAW = [
  { name:'Одяг та взуття', icon:'👗', children:[
      { name:'Жіночий одяг', children:['Сукні','Спідниці','Блузи'] },
      { name:'Чоловічий одяг', children:['Сорочки','Футболки','Штани'] },
      { name:'Дитячий одяг', children:['Для дівчаток','Для хлопчиків','Немовлята'] },
      { name:'Взуття жіноче', children:['Туфлі','Кросівки','Черевики'] },
      { name:'Взуття чоловіче', children:['Кросівки','Черевики','Сандалі'] },
      { name:'Верхній одяг', children:['Куртки','Пальта','Пуховики'] },
      { name:'Спортивний одяг', children:['Костюми','Лосини','Шорти'] },
      { name:'Білизна', children:['Жіноча','Чоловіча','Домашня'] },
      { name:'Аксесуари', children:['Ремені','Шарфи','Рукавички'] },
      { name:'Сумки та гаманці', children:['Сумки','Рюкзаки','Гаманці'] }
  ]},
  { name:'Дім та побут', icon:'🏠', children:[

function buildCategoryModel(){
  const nodesById = {};
  const roots = [];
  CATEGORY_TREE_RAW.forEach((r1, i1) => {
    const id1 = 'c'+(i1+1);
    nodesById[id1] = { id:id1, name:r1.name, icon:r1.icon, level:1, parentId:null, childIds:[] };
    roots.push(id1);
    r1.children.forEach((r2, i2) => {
      const id2 = id1+'-'+(i2+1);
      nodesById[id2] = { id:id2, name:r2.name, level:2, parentId:id1, childIds:[] };
      nodesById[id1].childIds.push(id2);
      r2.children.forEach((leafName, i3) => {
        const id3 = id2+'-'+(i3+1);
        nodesById[id3] = { id:id3, name:leafName, level:3, parentId:id2, childIds:[] };
        nodesById[id2].childIds.push(id3);
      });
    });
  });
  return { nodesById, roots };
}
const CAT_MODEL = buildCategoryModel();
const CAT_NODES = CAT_MODEL.nodesById;
const CAT_ROOTS = CAT_MODEL.roots;

function findIdByNamePath(path){
  let ids = CAT_ROOTS, found = null;
  for (const segName of path){
    found = ids.find(id => CAT_NODES[id].name === segName);
    if (!found) return null;
    ids = CAT_NODES[found].childIds;
  }
  return found;
}
/* Виняток за ТЗ: Дім та побут → Інструменти → Акумуляторний інструмент — активний за замовчуванням (до нього прив'язаний демо-товар) */
const DEFAULT_CHECKED_LEAF = findIdByNamePath(['Дім та побут','Інструменти','Акумуляторний інструмент']);

function getCategoryPath(id){
  const path = []; let cur = id;
  while (cur){ path.unshift(CAT_NODES[cur].name); cur = CAT_NODES[cur].parentId; }
  return path;
}

/* ============================================================
   ЗБЕРЕЖЕНИЙ СТАН (localStorage)
   ============================================================ */
const LS_KEY_STATE = 'beroo_category_selection_v1';
const LS_KEY_CONFIGURED = 'beroo_category_configured_v1';

function buildDefaultCheckedState(){
  const state = {};
  Object.keys(CAT_NODES).forEach(id => state[id] = false);
  if (DEFAULT_CHECKED_LEAF) state[DEFAULT_CHECKED_LEAF] = true;
  return state;
}
function loadCheckedState(){
  try{
    const raw = localStorage.getItem(LS_KEY_STATE);
    if (raw){
      const parsed = JSON.parse(raw);
      const state = buildDefaultCheckedState();
      Object.keys(state).forEach(id => { if (id in parsed) state[id] = !!parsed[id]; });
      return state;
    }
  }catch(e){}
  return buildDefaultCheckedState();
}
function persistCheckedState(state){ try{ localStorage.setItem(LS_KEY_STATE, JSON.stringify(state)); }catch(e){} }
function loadConfigured(){ try{ return localStorage.getItem(LS_KEY_CONFIGURED) === '1'; }catch(e){ return false; } }
function persistConfigured(v){ try{ localStorage.setItem(LS_KEY_CONFIGURED, v ? '1' : '0'); }catch(e){} }

let savedCheckedState = loadCheckedState();
let isConfigured = loadConfigured();
let draftCheckedState = null;

const expandedOnPage = {};
const expandedPicker = {};

/* ============================================================
   ЛОГІКА ЧЕКБОКСІВ: реальний стан зберігається лише на листках
   (3-й ранг), стан категорій 1-го/2-го рангу похідний:
   'checked' / 'unchecked' / 'indeterminate'
   ============================================================ */
function getNodeState(state, id){
  const node = CAT_NODES[id];
  if (node.childIds.length === 0) return state[id] ? 'checked' : 'unchecked';
  const childStates = node.childIds.map(cid => getNodeState(state, cid));
  if (childStates.every(s => s === 'checked')) return 'checked';
  if (childStates.every(s => s === 'unchecked')) return 'unchecked';
  return 'indeterminate';
}
function isNodeIncluded(state, id){ return getNodeState(state, id) !== 'unchecked'; }
function setLeavesChecked(state, id, value){
  const node = CAT_NODES[id];
  if (node.childIds.length === 0){ state[id] = value; return; }
  node.childIds.forEach(cid => setLeavesChecked(state, cid, value));
}
function toggleNode(state, id){
  const newValue = getNodeState(state, id) !== 'checked';
  setLeavesChecked(state, id, newValue);
}

/* ---------- Модалка товару з пікером обраних категорій ---------- */
function openProductModal(id){
  const p = id ? DATA.products.find(x=>x.id===id) : { emoji:'📦', name:'', price:'', qty:'', categoryId:null };
  pickedCategoryId = p.categoryId;
  openModal(`
    <div class="modal-head">
      <div><h3>${id?'Редагувати товар':'Новий товар'}</h3><p>Заповніть дані та оберіть категорію</p></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Назва товару</label><input id="pfName" value="${p.name}"></div>
      <div class="row" style="gap:10px;">
        <div class="field" style="flex:1;"><label>Ціна, ₴</label><input id="pfPrice" type="number" value="${p.price}"></div>
        <div class="field" style="flex:1;"><label>Залишок, шт</label><input id="pfQty" type="number" value="${p.qty}"></div>
      </div>
      <div class="field">
        <label>Категорія</label>
        <div class="picker-box" id="pickerBox">${renderPicker()}</div>
        <div class="picker-selected-line" id="pickerSelectedLine">${renderPickerSelectedLine()}</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Скасувати</button>
      <button class="btn btn-primary" onclick="saveProduct(${id||'null'})">Зберегти</button>
    </div>
  `, 520);
}
function renderPickerSelectedLine(){
  if (!pickedCategoryId) return '⚠ Категорію не обрано';
  return `✓ Обрано: ${getCategoryPath(pickedCategoryId).join(' → ')}`;
}
function renderPicker(){
  const checkedRoots = CAT_ROOTS.filter(id=>isNodeIncluded(savedCheckedState, id));
  if (checkedRoots.length === 0){
    return `<div style="padding:14px;text-align:center;color:var(--ink-500);font-size:12.5px;">Спершу налаштуйте структуру категорій на сторінці «Категорії»</div>`;
  }
  return checkedRoots.map(id=>renderPickerNode(id)).join('');
}
function renderPickerNode(id){
  const node = CAT_NODES[id];
  const checkedChildren = node.childIds.filter(cid=>isNodeIncluded(savedCheckedState, cid));
  const isOpen = !!expandedPicker[id];
  const isSelected = pickedCategoryId === id;
  if (checkedChildren.length === 0){
    return `<div class="picker-leaf ${isSelected?'selected':''}" onclick="selectPickerCategory('${id}')" style="padding-left:${10+(node.level-1)*14}px;">
      <span class="radio"></span>${node.name}
    </div>`;
  }
  const head = `
    <div class="picker-node-head" onclick="togglePickerNode('${id}')">
      <span class="chev ${isOpen?'open':''}">▸</span>
      <span>${node.icon?node.icon+' ':''}${node.name}</span>
    </div>
  `;
  const childrenHtml = checkedChildren.map(cid=>renderPickerNode(cid)).join('');
  return `${head}<div class="picker-children ${isOpen?'':'hidden'}">${childrenHtml}</div>`;
}
function togglePickerNode(id){
  expandedPicker[id] = !expandedPicker[id];
  document.getElementById('pickerBox').innerHTML = renderPicker();
}
function selectPickerCategory(id){
  pickedCategoryId = id;
  document.getElementById('pickerBox').innerHTML = renderPicker();
  document.getElementById('pickerSelectedLine').innerHTML = renderPickerSelectedLine();
}
function saveProduct(id){
  const name = document.getElementById('pfName').value || 'Без назви';
  const price = Number(document.getElementById('pfPrice').value) || 0;
  const qty = Number(document.getElementById('pfQty').value) || 0;
  if (!pickedCategoryId){ showToast('Оберіть категорію товару'); return; }
  if (id){
    const p = DATA.products.find(x=>x.id===id);
    p.name = name; p.price = price; p.qty = qty; p.categoryId = pickedCategoryId;
  } else {
    DATA.products.push({ id: Date.now(), emoji:'📦', name, price, qty, categoryId: pickedCategoryId });
  }
  closeModal();
  showToast('Товар збережено ✓');
  renderProducts();
}

/* ============================================================
   КАТЕГОРІЇ — банер + модалка налаштування + результуюче дерево
   ============================================================ */
function renderCategoryBannerHtml(){
  return !isConfigured ? `
    <div class="category-banner">
      <div class="cb-icon">🌳</div>
      <div class="cb-text">
        <div class="cb-title">Розгорнути структуру підкатегорій</div>
        <div class="cb-sub">Оберіть, які категорії та підкатегорії актуальні саме для вашого магазину</div>
      </div>
      <button class="btn btn-primary" onclick="openCategoryConfigModal()">Почати</button>
    </div>
  ` : '';
}

function renderCategories(){
  const bannerHtml = isConfigured ? `
    <div class="row mb-12" style="justify-content:flex-end;">
      <button class="btn btn-ghost btn-sm" onclick="openCategoryConfigModal()">⚙ Змінити структуру категорій</button>
    </div>
  ` : renderCategoryBannerHtml();

  const treeHtml = `<div class="cat-tree">${CAT_ROOTS.map(id => renderPageCategoryNode(id)).join('')}</div>`;

  document.getElementById('mainContent').innerHTML = `
    ${bannerHtml}
    <div class="page-head">
      <div>
        <h1>Категорії</h1>
        <p>Дерево категорій, обране для вашого магазину</p>
      </div>
    </div>
    ${treeHtml}
  `;
}
function countProductsForNode(id){
  const node = CAT_NODES[id];
  const checkedChildren = node.childIds.filter(cid=>isNodeIncluded(savedCheckedState, cid));
  if (checkedChildren.length === 0){
    return DATA.products.filter(p=>p.categoryId===id).length;
  }
  return checkedChildren.reduce((s,cid)=>s+countProductsForNode(cid),0);
}
function renderPageCategoryNode(id){
  const node = CAT_NODES[id];
  const checkedChildren = node.childIds.filter(cid=>isNodeIncluded(savedCheckedState, cid));
  const count = countProductsForNode(id);
  const isOpen = !!expandedOnPage[id];
  if (checkedChildren.length === 0){
    const emptyRootLabel = (node.level===1 && count===0) ? 'Порожня категорія' : `${count} товар${count===1?'':'и'}`;
    return `
      <div class="cat-leaf-row" onclick="showToast('Категорія: ${getCategoryPath(id).join(' → ')}')">
        <span style="font-size:13px;">${node.level===1?(node.icon||'📁'):'📁'}</span>
        <span style="flex:1;font-size:13px;font-weight:${node.level===1?700:600};">${node.name}</span>
        <span class="cat-node-count ${count>0?'has-items':''}">${emptyRootLabel}</span>
      </div>
    `;
  }
  return `
    <div class="cat-node">
      <div class="cat-node-head" onclick="togglePageCategoryNode('${id}')">
        <span class="chev ${isOpen?'open':''}">▸</span>
        <div class="cat-node-icon ${node.level>1?'sub':''}">${node.icon || '📁'}</div>
        <div class="cat-node-name ${node.level>1?'sub':''}">${node.name}</div>
        <span class="cat-node-count ${count>0?'has-items':''}">${count} товар${count===1?'':'и'} · ${checkedChildren.length} підкатегорій</span>
      </div>
      <div class="cat-children ${isOpen?'open':''}">
        <div class="cat-children-inner">
          ${checkedChildren.map(cid=>renderPageCategoryNode(cid)).join('')}
        </div>
      </div>
    </div>
  `;
}
function togglePageCategoryNode(id){
  expandedOnPage[id] = !expandedOnPage[id];
  renderCategories();
}

/* ---------- Модалка налаштування дерева (чекбокси) ---------- */
function openCategoryConfigModal(){
  draftCheckedState = Object.assign({}, savedCheckedState);
  Object.keys(CAT_NODES).forEach(id => { if (CAT_NODES[id].childIds.length > 0) expandedInModal[id] = true; });
  openModal(`
    <div class="modal-head">
      <div><h3>Налаштування структури категорій</h3><p>Позначте чекбоксами категорії та підкатегорії, актуальні для вашого магазину</p></div>
      <button class="modal-close" onclick="closeCategoryModalLater()">✕</button>
    </div>
    <div class="modal-body">
      <div class="tree-box" id="modalTreeBox">${renderModalTree()}</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeCategoryModalLater()">Пізніше</button>
      <button class="btn btn-primary" onclick="saveCategoryConfig()">Зберегти</button>
    </div>
  `, 640);
}
function renderModalTree(){
  return CAT_ROOTS.map(id => renderModalNode(id)).join('');
}
function renderModalNode(id){
  const node = CAT_NODES[id];
  const hasChildren = node.childIds.length > 0;
  const isOpen = !!expandedInModal[id];
  const nodeState = getNodeState(draftCheckedState, id);
  const paddingLeft = 6 + (node.level-1)*22;
  let html = `
    <div class="tree-row" style="padding-left:${paddingLeft}px;">
      <button class="tree-expand-btn ${hasChildren?'':'invisible'}" onclick="toggleModalExpand('${id}')">${hasChildren ? (isOpen?'−':'+') : ''}</button>
      <div class="tree-check-label" onclick="onModalCheckboxChange('${id}')">
        <span class="tree-checkbox-visual ${nodeState}"></span>
        <span class="tree-node-name lvl${node.level}">${node.icon?node.icon+' ':''}${node.name}</span>
      </div>
    </div>
  `;
  if (hasChildren){
    html += `<div class="tree-children ${isOpen?'open':''}" id="tc-${id}">${node.childIds.map(cid=>renderModalNode(cid)).join('')}</div>`;
  }
  return html;
}
function toggleModalExpand(id){
  expandedInModal[id] = !expandedInModal[id];
  document.getElementById('modalTreeBox').innerHTML = renderModalTree();
}
function onModalCheckboxChange(id){
  toggleNode(draftCheckedState, id);
  document.getElementById('modalTreeBox').innerHTML = renderModalTree();
}
function closeCategoryModalLater(){
  draftCheckedState = null;
  closeModal();
}
function saveCategoryConfig(){
  savedCheckedState = Object.assign({}, draftCheckedState);
  persistCheckedState(savedCheckedState);
  isConfigured = true;
  persistConfigured(true);
  draftCheckedState = null;
  closeModal();
  showToast('Структуру категорій збережено ✓');
  if (currentView === 'products') renderProducts();
  else renderCategories();
}

/* ============================================================
   MODAL / TOAST / MOBILE MENU
   ============================================================ */
function openModal(html, maxWidthPx){
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalContent').style.maxWidth = (maxWidthPx || 520) + 'px';
  document.getElementById('modal').classList.add('active');
  document.getElementById('modal').scrollTop = 0;
}
function closeModal(){ document.getElementById('modal').classList.remove('active'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function toggleMobileMenu(){ document.getElementById('mobileMenu').classList.toggle('active'); }
function showToast(msg){
  const w = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  w.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 2500);
}
</script>
